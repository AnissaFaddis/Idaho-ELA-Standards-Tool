ade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.7",text:"Develop engaging presentations that make strategic and creative use of digital media (e.g., textual, graphical, audio, visual, and interactive elements) to add interest and enhance audience understanding of findings, reasoning, and evidence.",tags:["digital-media-use","multimodal-literacies","oral-presentation"],essential:!0},{id:"IN-CC-11-12-8",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.8",text:"Analyze the impact of the media on the public, including identifying and analyzing rhetorical and logical fallacies.",tags:["media-analysis","rhetorical-analysis","argument-evaluation"],essential:!0},{id:"GA-9-12-L-GC-1",state:"Georgia",stateAbbr:"GA",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Language",code:"9-12.L.GC.1",text:"Draw from knowledge of the conventions of Standard English grammar, usage, and mechanics when analyzing, evaluating and constructing texts.",tags:["usage-conventions","punctuation"],subStrand:"9-12.L.GC.1 Grammar, Usage, & Mechanics: Draw from knowledge of the conventions of Standard English grammar, usage, and mechanics when analyzing, evaluating and constructing texts."},{id:"GA-9-L-GC-2-a",state:"Georgia",stateAbbr:"GA",grade:"9",gradesCovered:[9],strand:"Language",code:"9.L.GC.2.a",text:"Apply understandings of syntax to comprehend, analyze, and evaluate a wide variety of texts, recognizing instances of parallel structure.",tags:["sentence-structure"],subStrand:"9-12.L.GC.2 Syntax: Apply understanding of syntax to comprehend, analyze, evaluate, craft, and reshape sentences to achieve desired effects."},{id:"GA-10-L-GC-2-a",state:"Georgia",stateAbbr:"GA",grade:"10",gradesCovered:[10],strand:"Language",code:"10.L.GC.2.a",text:"Apply understandings of syntax to comprehend, analyze, and evaluate a wide variety of texts, including analyzing instances of parallel structur ues","academic-vocabulary","word-patterns"],subStrand:"K-12.P.EICC.3 Comprehension Strategies: Engage with a range of complex texts for a variety of tasks and purposes, accessing and using strategies for comprehension before, during, and after reading as part of the meaning-making process."},{id:"GA-K-12-P-EICC-4-a",state:"Georgia",stateAbbr:"GA",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Practices",code:"K-12.P.EICC.4.a",text:"Establish a purpose and goals for writing and identify a target audience.",tags:["writing-process","range-of-writing"],subStrand:"K-12.P.EICC.4 Writing Processes: Compose a range of texts for a variety of purposes and audiences, flexibly engaging in writing processes to plan, draft, evaluate, revise, and edit texts."},{id:"GA-K-12-P-EICC-4-b",state:"Georgia",stateAbbr:"GA",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Practices",code:"K-12.P.EICC.4.b",text:"Plan how to organize the text by selecting modes, genres, and structures that will achieve the purpose and meet the needs of the target audience.",tags:["writing-process","writing-organization","genre-characteristics"],subStrand:"K-12.P.EICC.4 Writing Processes: Compose a range of texts for a variety of purposes and audiences, flexibly engaging in writing processes to plan, draft, evaluate, revise, and edit texts."},{id:"GA-K-12-P-EICC-4-c",state:"Georgia",stateAbbr:"GA",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Practices",code:"K-12.P.EICC.4.c",text:"Generate ideas for content by assessing prior knowledge, gathering information from texts, and engaging in discussions with others.",tags:["writing-process","collaborative-discussion"],subStrand:"K-12.P.EICC.4 Writing Processes: Compose a range of texts for a variety of purposes and audiences, flexibly engaging in writing processes to plan, draft, evaluate, revise, and edit texts."},{id:"GA-K-12-P-EICC-4-d",state:"Georgia",stateAbbr:"GA",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Practices",code:"K-12.P.EICC.4.d",text:"Link .app{--hdr:84px;--ink:#1A1D21;--ink2:#4A5259;--ink3:#767E86;--line:#D8DCE0;--line2:#E9ECEF;--bg:#F2F3F1;--surf:#FFFFFF;--id:#1D4E6F;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;line-height:1.5;}
.app *{box-sizing:border-box;}
.top{background:var(--surf);border-bottom:2px solid var(--ink);padding:14px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.brand h1{margin:0;font-size:19px;font-weight:650;letter-spacing:-0.02em;}
.sub{margin:3px 0 0;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;}
.nav{display:flex;gap:2px;}
.navbtn{border:1px solid var(--line);background:var(--surf);color:var(--ink2);padding:7px 13px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;}
.navbtn:hover{background:var(--bg);color:var(--ink);}
.navbtn-on{background:var(--ink);color:#fff;border-color:var(--ink);}
.navbtn:focus-visible,.btn:focus-visible,.tag:focus-visible,.input:focus-visible{outline:2px solid var(--id);outline-offset:1px;}
.body{display:flex;align-items:flex-start;}
.panel{width:250px;flex:none;position:sticky;top:var(--hdr);max-height:calc(100vh - var(--hdr));overflow-y:auto;background:var(--surf);border-right:1px solid var(--line);padding:16px 14px;}
.pgroup{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line2);}
.pgroup-last{border-bottom:none;margin-bottom:0;}
.plabel{display:block;font-size:10px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--ink3);margin-bottom:5px;}
.input{width:100%;padding:7px 9px;border:1px solid var(--line);background:var(--surf);font-size:13px;font-family:inherit;color:var(--ink);}
.input:focus{border-color:var(--id);}
.hint{font-size:11px;color:var(--ink3);margin:6px 0 0;line-height:1.45;}
.hint-priv{border-left:2px solid var(--line);padding-left:7px;}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;}
.tagfilter{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.main{flex:1;padding:20px 22px 60px;min-width:0;}
.intro{background:var(--surf);border:1px solid var(--line);border-left:3px solid var(--id);padding:16px 18px;margin-bottom:18px;}
.intro h2{margin:0 0 5px;font-size:16px;font-weight:650;}
.intro p{margin:0;color:var(--ink2);max-width:64ch;}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--id);}
.anchorwrap{margin-bottom:24px;}
.anchor{background:var(--surf);border:1px solid var(--line);border-top:3px solid var(--id);padding:16px 18px;}
.anchor-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
.anchor-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.anchor-code{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.anchor-text{font-size:15px;line-height:1.55;margin:8px 0 10px;max-width:88ch;}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--line2);padding:1px 5px;color:var(--ink);}
.code-lg{font-size:14px;font-weight:600;}
.meta{font-size:12px;color:var(--ink3);}
.essbox{background:#FBF7EC;border:1px solid #E4D4A8;border-left:3px solid #A8842C;padding:9px 11px;margin:9px 0;}
.essbox strong{font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:#7A5F1A;}
.essbox p{margin:4px 0 0;font-size:12px;color:var(--ink2);}
.ess{font-size:9px;font-weight:700;letter-spacing:0.06em;background:#FBF7EC;border:1px solid #E4D4A8;color:#7A5F1A;padding:1px 5px;}
.caveat{background:#FFFDF5;border:1px solid #E8DFC2;border-left:3px solid #B89A3E;padding:9px 12px;margin:12px 0;font-size:12px;color:var(--ink2);line-height:1.5;}
.caveat strong{color:#7A5F1A;text-transform:uppercase;font-size:10px;letter-spacing:0.07em;margin-right:5px;}
.cols{display:grid;grid-template-columns:repeat(7,minmax(215px,1fr));gap:10px;padding-bottom:6px;overflow:visible;}
.col{min-width:0;}
.colhead{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid;border-bottom-width:2px;margin-bottom:8px;position:sticky;top:var(--hdr);z-index:5;box-shadow:0 2px 0 0 rgba(0,0,0,0.04);}
.colname{font-size:11px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.colcount{margin-left:auto;font-size:11px;font-weight:650;color:var(--ink2);font-variant-numeric:tabular-nums;}
.card{background:var(--surf);border:1px solid var(--line);border-left:3px solid;padding:9px 11px;margin-bottom:8px;}
.card-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:0.04em;border:1px solid;padding:1px 5px;white-space:nowrap;}
.badge-dot{width:5px;height:5px;border-radius:50%;flex:none;}
.strand{font-size:11px;color:var(--ink3);font-weight:600;margin-bottom:4px;}
.substrand{font-weight:400;font-style:italic;}
.text{margin:0 0 7px;font-size:13px;line-height:1.5;color:var(--ink);}
.tags{display:flex;flex-wrap:wrap;gap:3px;}
.tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);padding:1px 5px;font-family:inherit;}
.tag-static{cursor:default;}
.tag-shared{background:#E3EDF3;border-color:var(--id);color:var(--id);font-weight:650;}
.tag-anchor{background:#E3EDF3;border-color:var(--id);color:var(--id);}
.tag-on{background:var(--ink);color:#fff;border-color:var(--ink);}
.match{font-size:10px;color:var(--ink3);margin-top:6px;font-style:italic;}
.btn{border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:5px 10px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--bg);border-color:var(--ink2);}
.btn-sm{padding:3px 8px;font-size:11px;}
.btn-block{width:100%;}
.list{margin-top:8px;}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:12px;flex-wrap:wrap;}
.listhead h3{margin:0;font-size:14px;font-weight:650;letter-spacing:0.01em;}
.count{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;}
.grid-search{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));}
.empty{background:var(--surf);border:1px dashed var(--line);padding:14px;font-size:12px;color:var(--ink3);line-height:1.5;}
.gaps{display:flex;flex-direction:column;gap:14px;}
.gap{background:var(--surf);border:1px solid var(--line);padding:12px 14px;}
.gap-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--line2);padding-bottom:7px;margin-bottom:9px;}
.gap-head h4{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;font-weight:650;}
.gap-states{display:flex;gap:3px;flex-wrap:wrap;}
.gap-head .count{margin-left:auto;}
.flag{font-size:11px;padding:6px 9px;margin-bottom:8px;line-height:1.45;}
.flag-thin{background:var(--bg);border-left:3px solid var(--ink3);color:var(--ink2);}
.flag-art{background:#FFFDF5;border-left:3px solid #B89A3E;color:#6B5518;}
.gap-recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px;}
.about{max-width:none;}
.about h2{font-size:18px;font-weight:650;margin:0 0 6px;}
.lede{font-size:14px;color:var(--ink2);max-width:70ch;margin:0 0 18px;}
.ac{background:var(--surf);border:1px solid var(--line);padding:14px 16px;margin-bottom:12px;}
.ac h3{margin:0 0 7px;font-size:14px;font-weight:650;}
.ac p{margin:0 0 8px;color:var(--ink2);max-width:78ch;line-height:1.55;}
.ac-in{border-left:3px solid;padding-left:10px;}
.def{font-size:12px;margin:5px 0 4px !important;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 12px;}
.bars{margin:12px 0 0;}
.bar{display:flex;align-items:center;gap:9px;margin-bottom:4px;}
.bar-l{width:105px;font-size:11px;color:var(--ink2);flex:none;}
.bar-t{flex:1;height:13px;background:var(--bg);border:1px solid var(--line2);}
.bar-f{display:block;height:100%;}
.bar-n{width:32px;text-align:right;font-size:11px;font-variant-numeric:tabular-nums;color:var(--ink2);flex:none;}
.sn{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:5px;}
.sn li{display:flex;align-items:center;gap:7px;}
.sn-s{display:flex;gap:3px;}
.strandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px;}
.sg{border-left:3px solid;padding-left:9px;}
.sg ul{margin:5px 0 0;padding-left:15px;font-size:11px;color:var(--ink2);line-height:1.5;}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;font-size:12px;z-index:50;}
@media (max-width:1100px){.cols{grid-template-columns:repeat(7,240px);min-width:max-content;}.two{grid-template-columns:1fr;}}
@media (max-width:820px){.body{flex-direction:column;}.panel{width:100%;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);}.colhead{position:static;}}
@media print{.top,.panel,.btn,.navbtn,.toast{display:none !important;}.app{background:#fff;}.cols{grid-template-columns:repeat(2,1fr);overflow:visible;}.card,.anchor,.gap{break-inside:avoid;}.main{padding:0;}}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
