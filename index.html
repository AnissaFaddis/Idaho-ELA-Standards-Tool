<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Standards Comparison Tool — Idaho 9–12 ELA</title>
<meta name="description" content="Compare Idaho's 9-12 ELA standards against seven other states. Committee review instrument.">
<meta name="robots" content="noindex, nofollow">
<style>
  html,body{margin:0;padding:0;background:#F2F3F1;}
  #root{min-height:100vh;}
  .boot{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:40px 24px;color:#767E86;font-size:14px;}
  /* Version stamp — EDIT THE DATE BELOW. Search for: DATASET_DATE */
  .stamp{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:11px;color:#767E86;background:#FFFFFF;border-top:1px solid #D8DCE0;
    padding:10px 22px;text-align:left;line-height:1.5;}
  .stamp strong{color:#4A5259;font-weight:600;}
  @media print{.stamp{border-top:1px solid #999;}}
</style>
</head>
<body>
<div id="root"><div class="boot">Loading the standards dataset…</div></div>
<script>
// Keep sticky column headers clear of the site header, whatever height it wraps to.
(function(){
  function sync(){
    var app=document.querySelector('.app'), top=document.querySelector('.top');
    if(!app||!top) return;
    app.style.setProperty('--hdr', Math.ceil(top.getBoundingClientRect().height)+6+'px');
  }
  var t; function debounced(){ clearTimeout(t); t=setTimeout(sync,100); }
  window.addEventListener('resize', debounced);
  window.addEventListener('load', function(){ sync(); setTimeout(sync,300); });
  new MutationObserver(function(_,o){ if(document.querySelector('.top')){ sync(); o.disconnect(); } })
    .observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<footer class="stamp">
  <strong>Standards Comparison Tool</strong> — Phase 2 build ·
  Built <strong>16 July 2026</strong> ·
  Dataset v4 (66-tag controlled vocabulary), 1,006 records across 8 states, grades 9–12 ELA only.
  Record counts are not comparable across states — see “About the data”.

  <!-- BUILD_DATE: 16 July 2026 -->

</footer>

rse voices and perspectives in works of literature.",tags:["point-of-view"],subStrand:"Literature",essential:!1},{id:"ID-RC-L-9-10-5e",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.L.5e",text:"Compare multiple interpretations of texts (including recorded or live production), evaluating how each version interprets the source text.",tags:["multiple-interpretations"],subStrand:"Literature",essential:!1},{id:"ID-RC-NF-9-10-6",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.NF.6",text:"Use evidence from nonfiction works to demonstrate understanding of grade-level texts.",tags:["nonfiction-evidence-understanding"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-RC-NF-9-10-6a",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.NF.6a",text:"Analyze the development of central ideas over the course of texts, including how they emerge and are shaped and refined by specific details; provide accurate summaries of how key events or ideas develop.",tags:["central-idea"],subStrand:"Nonfiction Text",essential:!0,eqg:"RC.9-10.6a"},{id:"ID-RC-NF-9-10-6b",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.NF.6b",text:"Explain how authors unfold an analysis or series of ideas or events, including the order in which points are made, how they are introduced and developed, and the connections that are drawn among them.",tags:["analysis-of-ideas"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-RC-NF-9-10-6c",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.NF.6c",text:"Analyze how authors use structure to explain relationships among concepts in a text, including how key sentences, paragraphs, and sections of texts contribute to the whole.",tags:["nonfiction-text-structure"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-RC-NF-9-10-6d",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.NF.6d",text:"Assess the argument and specific claims in texts, examining whether the reasoning is valid, the evidence is relevant, and whether there are any false or unsupported statements.",tags:["argument-evaluation"],subStrand:"Nonfiction Text",essential:!0,eqg:"RC.9-10.6d"},{id:"ID-RC-NF-9-10-6e",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.NF.6e",text:"Analyze seminal documents of historical and literary significance, including how they address related themes and concepts of liberty, equality, individual responsibility, and justice.",tags:["seminal-documents"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-VD-WB-9-10-1",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.1",text:"Determine or clarify the meaning of unknown and multiple-meaning words and phrases based on grade-level content, choosing flexibly from a range of strategies.",tags:["context-clues"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-1a",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.1a",text:"Use context (e.g., the overall meaning of a sentence, paragraph, or portion of text; a word\u2019s position or function in a sentence) as a clue to the meaning of a word or phrase.",tags:["context-clues"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-1b",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.1b",text:"Identify and correctly use patterns of word changes that indicate different meanings or parts of speech (e.g., defend, defense, defendant, defensible).",tags:["word-patterns"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-1c",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.1c",text:"Consult general and specialized reference materials (e.g., dictionaries, glossaries, thesauruses), print or digital, to find the pronunciation of a grade-level word and determine or clarify its precise meaning, its part of speech, or its etymology.",tags:["reference-materials"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-1d",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.1d",text:"Verify the preliminary determination of the meaning of a word or phrase (e.g., by checking the inferred meaning in context or in a dictionary).",tags:["word-meaning-verification"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-2",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.2",text:"Determine how words and phrases provide meaning and nuance to texts.",tags:["word-nuance"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-2a",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.2a",text:"Use Greek, Latin, and Norse mythology, and other works often alluded to in American and world literature to understand the meaning of words or phrases (e.g., reference to \u201CAchilles\u2019s heel\u201D from Greek mythology).",tags:["allusion"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-2b",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.2b",text:"Interpret figurative language (e.g., hyperbole, paradox) in context and analyze its role in texts (e.g., The Party\u2019s embrace of the slogans \u201CWar is Peace\u201D and \u201CFreedom is Slavery\u201D in Orwell\u2019s 1984).",tags:["figurative-language"],subStrand:"Word Building",essential:!0,eqg:"9/10.VD.2b"},{id:"ID-VD-WB-9-10-2c",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.2c",text:"Analyze nuances in the meaning of words with similar denotations (e.g., shrewd, clever, cunning, brainy).",tags:["word-nuance"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-9-10-2d",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.WB.2d",text:"Analyze the cumulative impact of specific word choices on meaning and tone (e.g., how Jonathan Swift uses exaggeration to create his satirical essay \u201CA Modest Proposal\u201D).",tags:["word-choice-impact"],subStrand:"Word Building",essential:!1},{id:"ID-VD-AV-9-10-3",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Vocabulary Development",code:"9-10.VD.AV.3",text:"Acquire and use accurately general academic and content-specific words and phrases occurring in grade- level reading and content; demonstrate independence when gathering vocabulary knowledge when considering a word or phrase important to comprehension or expression. Use these words in discussions and writing.",tags:["academic-vocabulary"],subStrand:"Academic Vocabulary",essential:!1},{id:"ID-RS-IP-9-10-1",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Research",code:"9-10.RS.IP.1",text:"Conduct brief as well as multi-day research projects to take some action or share findings orally or in writing by formulating a research question and considering alternative avenues of inquiry; gathering relevant information from a variety authoritative sources and assessing which provide the most reliable and useful information; and following a standard approved format (e.g., APA, MLA, Chicago) for citations and bibliographies.",tags:["inquiry-process","citation-format"],subStrand:"Inquiry Process to Build, Present, and Use Knowledge",essential:!0,eqg:"RS.9-10.1"},{id:"ID-W-RW-9-10-1",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.RW.1",text:"Develop flexibility in writing by routinely engaging in the production of shorter and longer pieces for a range of tasks, purposes, and audiences. This could include, among others, summaries, reflections, descriptions, critiques, letters, and poetry, etc.",tags:["range-of-writing"],subStrand:"Range of Writing",essential:!1},{id:"ID-W-RW-9-10-3",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.RW.3",text:"Write informational texts that introduce the topic clearly by providing needed context, presenting well- defined theses, and previewing what is to follow; develop the topic through sustained use of the most significant and relevant facts, extended definitions, concrete details, quotations, or other information and examples from multiple authoritative sources appropriate to the audience\u2019s knowledge of the topic; and provide a concluding section that follows from the information or explanation presented.",tags:["informational-writing"],subStrand:"Range of Writing",essential:!0,eqg:"W.9-10.3"},{id:"ID-W-RW-9-10-5",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.RW.5",text:"Produce clear and coherent organizational structures that attend to the norms and conventions of the writing genre and in which ideas, concepts, and other information are logically grouped; include formatting and graphics to support the purpose and create a unified whole; and use precise language, content-specific vocabulary, and varied transitions to link major sections of the text, create cohesion, and clarify the relationships between and among ideas and concepts.",tags:["writing-organization"],subStrand:"Range of Writing",essential:!1},{id:"ID-W-RW-9-10-6",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.RW.6",text:"Develop and strengthen writing as needed by planning, revising, editing, rewriting, or trying a new approach, focusing on addressing what is most significant for a specific purpose and audience. (Editing should demonstrate command of grade-level Grammar and Conventions.)",tags:["writing-process"],subStrand:"Range of Writing",essential:!1},{id:"ID-W-HWK-9-10-7",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.HWK.7",text:"Write by hand or with technology to produce, publish, and update individual or shared writing products, taking advantage of technology\u2019s capacity to link to other information and to display information flexibly and dynamically.",tags:["handwriting-keyboarding"],subStrand:"Handwriting and Keyboarding",essential:!1},{id:"ID-ODC-OC-9-10-1",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Oral and Digital Communications",code:"9-10.ODC.OC.1",text:"Engage in collaborative discussions about grade-level topics and texts with peers by setting rules for collegial discussions and decision-making, defining individual roles, tracking progress on specific goals; responding to others\u2019 questions and comments and diverse perspectives with precise evidence, relevant observations, and ideas; and making new connections considering the evidence and reasoning presented.",tags:["collaborative-discussion"],subStrand:"Oral Communications",essential:!0,eqg:"ODC.9-10.1"},{id:"ID-ODC-OC-9-10-2",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Oral and Digital Communications",code:"9-10.ODC.OC.2",text:"Analyze the effect of text and images on the reader's or viewer's emotions in print journalism, and images, sound, and text in electronic journalism, distinguishing techniques used in each to achieve these effects.",tags:["media-analysis"],subStrand:"Oral Communications",essential:!1},{id:"ID-ODC-OC-9-10-3",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Oral and Digital Communications",code:"9-10.ODC.OC.3",text:"Evaluate a speaker\u2019s point of view, reasoning, and use of evidence and rhetoric, identifying any fallacious reasoning or exaggerated or distorted evidence.",tags:["evaluating-speakers"],subStrand:"Oral Communications",essential:!0,eqg:"ODC.9-10.3"},{id:"ID-ODC-OC-9-10-4",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Oral and Digital Communications",code:"9-10.ODC.OC.4",text:"Report orally on a topic or text or present an argument, emphasizing salient points in a focused, coherent manner with relevant evidence, sound reasoning, and well-chosen details in a style appropriate to purpose, audience, and task.",tags:["oral-presentation"],subStrand:"Oral Communications",essential:!0,eqg:"ODC.9-10.4"},{id:"ID-ODC-DC-9-10-5",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Oral and Digital Communications",code:"9-10.ODC.DC.5",text:"Manage personal data to maintain digital privacy and security and be conscious and aware of data-collection technology used to track and exploit navigation online.",tags:["digital-privacy"],subStrand:"Digital Communications",essential:!1},{id:"ID-ODC-DC-9-10-6",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Oral and Digital Communications",code:"9-10.ODC.DC.6",text:"Integrate multiple sources of information presented in diverse digital media, evaluating the credibility and accuracy of each source.",tags:["source-evaluation","integrating-sources"],subStrand:"Digital Communications",essential:!1},{id:"ID-ODC-DC-9-10-7",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Oral and Digital Communications",code:"9-10.ODC.DC.7",text:"Analyze various accounts of a subject told in different media (e.g., a person\u2019s life story in print or digitally), determining which details are emphasized in each account.",tags:["media-comparison"],subStrand:"Digital Communications",essential:!1},{id:"ID-GC-GU-9-10-1",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1",text:"Demonstrate command of the conventions of English grammar and usage when writing or speaking.",tags:["usage-conventions"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1a",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1a",text:"Use verbs in the active and passive voice and in the conditional and subjunctive mood to achieve particular effects (e.g., emphasizing the actor or the action; expressing uncertainty or describing a state contrary to fact).",tags:["voice-and-mood"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1b",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1b",text:"Use parallel structure.",tags:["sentence-structure"],subStrand:"Grammar and Usage",essential:!0,eqg:"GC.9-10.1b"},{id:"ID-GC-GU-9-10-1c",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1c",text:"Place modifiers properly.",tags:["modifiers"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1d",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1d",text:"Use the subjunctive mood accurately.",tags:["voice-and-mood"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1e",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1e",text:"Avoid run-on sentences, comma splices, and sentence fragments.",tags:["sentence-errors"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1f",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1f",text:"Use subordination, coordination, apposition, and other devices to indicate the relationship between ideas clearly.",tags:["sentence-structure"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1g",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1g",text:"Use various types of phrases (noun, verb, adjectival, adverbial, participial, prepositional, absolute) to convey specific meanings and add variety and interest to writing or presentations.",tags:["sentence-structure"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1h",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1h",text:"Use various types of clauses (independent, dependent, noun, relative, adverbial) to convey specific meanings and add variety and interest to writing or presentations.",tags:["sentence-structure"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1i",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1i",text:"Adapt speech to a variety of contexts and tasks, using formal English when appropriate to task and situation.",tags:["formal-english"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-9-10-1j",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.GU.1j",text:"Choose language that expresses ideas precisely and concisely, recognizing and eliminating wordiness and redundancy.",tags:["precise-language"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-M-9-10-2",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.M.2",text:"Demonstrate command of the conventions of English punctuation and capitalization when writing and reading aloud to create meaning.",tags:["punctuation"],subStrand:"Mechanics",essential:!1},{id:"ID-GC-M-9-10-2a",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.M.2a",text:"Use a semicolon (or appropriate conjunctive adverb) to link two or more closely related independent clauses.",tags:["punctuation"],subStrand:"Mechanics",essential:!1},{id:"ID-GC-M-9-10-2b",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.M.2b",text:"Use a colon to introduce a list or quotation.",tags:["punctuation"],subStrand:"Mechanics",essential:!1},{id:"ID-GC-M-9-10-2c",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.M.2c",text:"Observe hyphenation conventions.",tags:["punctuation"],subStrand:"Mechanics",essential:!1},{id:"ID-GC-M-9-10-3",state:"Idaho",stateAbbr:"ID",grade:"9-10",gradesCovered:[9,10],strand:"Grammar and Conventions",code:"9-10.GC.M.3",text:"Spell correctly, consulting reference materials to check as needed.",tags:["spelling"],subStrand:"Mechanics",essential:!1},{id:"ID-RC-TC-11-12-1",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.TC.1",text:"Independently and proficiently read and comprehend texts representing a balance of genres, cultures, and perspectives that exhibit complexity at the lower end of the grades 11\u201312 band. (See the Quantitative Analysis Chart for Determining Text Complexity in the Resource Reference.)",tags:["text-complexity"],subStrand:"Text Complexity",essential:!1},{id:"ID-RC-V-11-12-2",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.V.2",text:"Regularly engage in a volume of reading, texts independently, with peers, or with modest support related to the topics and themes being studied to build knowledge and vocabulary.",tags:["volume-of-reading"],subStrand:"Volume of Reading to Build Knowledge",essential:!1},{id:"ID-RC-TE-11-12-3",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.TE.3",text:"Draw and cite strong and thorough evidence from grade-level texts to support claims and inferences, attending to important distinctions authors make and how those are supported, as well as any gaps or inconsistencies in accounts offered.",tags:["textual-evidence"],subStrand:"Textual Evidence",essential:!0,eqg:"RC.11-12.3"},{id:"ID-RC-RF-11-12-4",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.RF.4",text:"Read grade-level text with accuracy, automaticity, appropriate rate, and expression in successive readings to support comprehension (see the 2017 Hasbrouck and Tindal norms listed in Resource Reference).",tags:["reading-fluency"],subStrand:"Reading Fluency",essential:!1},{id:"ID-RC-L-11-12-5",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.L.5",text:"Use evidence from literature to demonstrate understanding of grade-level texts.",tags:["lit-evidence-understanding"],subStrand:"Literature",essential:!1},{id:"ID-RC-L-11-12-5a",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.L.5a",text:"Compare the development of a universal theme over the course of two texts, including how it emerges and is shaped and refined by specific details in each.",tags:["comparing-texts","theme-development"],subStrand:"Literature",essential:!1},{id:"ID-RC-L-11-12-5b",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.L.5b",text:"Evaluate the choices authors make regarding how to develop and relate several elements of literary texts , including how the characters are introduced and developed and how the action is ordered.",tags:["character-development"],subStrand:"Literature",essential:!1},{id:"ID-RC-L-11-12-5c",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.L.5c",text:"Evaluate how authors structure texts to distinguish what is directly stated in a text from what is really meant, including satire, sarcasm, irony, and understatement.",tags:["authorial-intent"],subStrand:"Literature",essential:!0,eqg:"RC.11-12.5c"},{id:"ID-RC-L-11-12-5d",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.L.5d",text:"Relate literary works and their authors\u2019 points of view to the political events and seminal ideas of their eras.",tags:["point-of-view","seminal-documents"],subStrand:"Literature",essential:!0,eqg:"RC.11-12.5d"},{id:"ID-RC-L-11-12-5e",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.L.5e",text:"Compare and contrast how works of literary or cultural significance, including myths and traditional stories, draw on similar themes, patterns of events, or character types.",tags:["comparing-texts"],subStrand:"Literature",essential:!1},{id:"ID-RC-NF-11-12-6",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.NF.6",text:"Use evidence from nonfiction works to demonstrate understanding of grade-level texts.",tags:["nonfiction-evidence-understanding"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-RC-NF-11-12-6a",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.NF.6a",text:"Compare texts that express similar central ideas and analyze in detail how their development and treatment of the topic compares over the course of the two texts; provide accurate summaries of how key events or ideas develop.",tags:["comparing-texts"],subStrand:"Nonfiction Text",essential:!0,eqg:"RC.11-12.6a"},{id:"ID-RC-NF-11-12-6b",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.NF.6b",text:"Evaluate various explanations of concepts and ideas and determine which explanation best accords with textual evidence, noting discrepancies among sources.",tags:["evaluating-explanations"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-RC-NF-11-12-6c",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.NF.6c",text:"Evaluate the effectiveness of the structure(s) and rhetorical devices authors use in their exposition or argument, including whether the structure helps makes points clear, convincing, and engaging.",tags:["rhetorical-analysis"],subStrand:"Nonfiction Text",essential:!0,eqg:"RC.11-12.6c"},{id:"ID-RC-NF-11-12-6d",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.NF.6d",text:"Analyze the hypotheses, data, analysis, and conclusions in an argument, verifying the data when possible and corroborating or challenging conclusions with other sources of information.",tags:["argument-evaluation"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-RC-NF-11-12-6e",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.NF.6e",text:"Evaluate the premises and purposes in works of public advocacy.",tags:["public-advocacy"],subStrand:"Nonfiction Text",essential:!1},{id:"ID-VD-WB-11-12-1",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.1",text:"Determine or clarify the meaning of unknown and multiple-meaning words and phrases based on grade-level content, choosing flexibly from a range of strategies.",tags:["context-clues"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-1a",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.1a",text:"Use context (e.g., the overall meaning of a sentence, paragraph, or portion of text; a word\u2019s position or function in a sentence or a sentence within a paragraph) as a clue to the meaning of a word or phrase.",tags:["context-clues"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-1b",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.1b",text:"Identify and correctly use patterns of word changes that indicate different meanings or parts of speech (e.g., symbol, symbolism, symbolic, symbolize).",tags:["word-patterns"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-1c",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.1c",text:"Consult general and specialized reference materials (e.g., dictionaries, glossaries, thesauruses), print or digital, to find the pronunciation of a grade-level word and determine or clarify its precise meaning, its part of speech, its etymology, or its standard usage.",tags:["reference-materials"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-1d",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.1d",text:"Verify the preliminary determination of the meaning of a word or phrase (e.g., by checking the inferred meaning in context or in a dictionary).",tags:["word-meaning-verification"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-2",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.2",text:"Determine how words and phrases provide meaning and nuance to texts.",tags:["word-nuance"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-2a",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.2a",text:"Use Greek, Latin, and Norse mythology; and other works often alluded to in American and world literature to understand the meaning of words or phrases (e.g., \u201Cnarcissistic\u201D from the myth of Narcissus and Echo).",tags:["allusion"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-2b",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.2b",text:"Analyze how an author uses and refines the meaning of a key term or terms over the course of a text (e.g., how FDR explored different ideas regarding freedom in his \u201CFour Freedoms\u201D speech).",tags:["figurative-language"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-2c",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.2c",text:"Analyze nuances in the meaning of words with similar denotations (e.g., aggressive, assertive, forceful, domineering).",tags:["word-nuance"],subStrand:"Word Building",essential:!1},{id:"ID-VD-WB-11-12-2d",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.WB.2d",text:"Analyze the impact of specific word choices on the effectiveness of the message meaning and the tone of the text.",tags:["word-choice-impact"],subStrand:"Word Building",essential:!0,eqg:"VD.11-12.2d"},{id:"ID-VD-AV-11-12-3",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Vocabulary Development",code:"11-12.VD.AV.3",text:"Acquire and use accurately general academic and content-specific words and phrases occurring in grade- level reading and content; demonstrate independence in gathering vocabulary knowledge when considering a word or phrase important to comprehension or expression. Use these words in discussions and writing.",tags:["academic-vocabulary"],subStrand:"Academic Vocabulary",essential:!1},{id:"ID-RS-IP-11-12-1",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Research",code:"11-12.RS.IP.1",text:"Conduct brief as well as multi-day research projects to take some action or share findings orally or in writing by formulating multiple interlocking research questions that span the field of inquiry in time and scope; gathering relevant information efficiently from a variety of authoritative sources, as well as from direct observation, interviews, and surveys; making distinctions about the strengths and limitations of each source in terms of the task, purpose, and audience, noting any discrepancies among the data; and following a standard approved format (e.g., APA, MLA, Chicago) for citations and bibliographies.",tags:["inquiry-process","citation-format"],subStrand:"Inquiry Process to Build, Present, and Use Knowledge",essential:!0,eqg:"RS.11-12.1"},{id:"ID-W-RW-11-12-1",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.RW.1",text:"Develop flexibility in writing by routinely engaging in the production of shorter and longer pieces for a range of tasks, purposes, and audiences. This could include, among others, summaries, reflections, descriptions, critiques, letters, and poetry, etc.",tags:["range-of-writing"],subStrand:"Range of Writing",essential:!1},{id:"ID-W-RW-11-12-2",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.RW.2",text:"Write arguments that support well-defined points of view that establish the significance of the claim(s) and distinguish those claim(s) from alternate or opposing claims with persuasive evidence and clear reasoning; point out the strengths and limitations of each claim in a manner that anticipates the audience\u2019s knowledge level, concerns, and values; and provide a concluding section that articulates the implications, or the significance, of the argument presented.",tags:["argument-writing"],subStrand:"Range of Writing",essential:!0,eqg:"W.11-12.2"},{id:"ID-W-RW-11-12-5",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.RW.5",text:"Produce clear and coherent organizational structures that attend to the norms and conventions of the writing genre, and in which ideas, concepts, and other information build on one another; include formatting and graphics to support the purpose, aid in comprehension, and create a unified whole; and use precise language, content-specific vocabulary, and varied transitions to link major sections of the text, create cohesion and clarify the relationships between and among ideas and concepts.",tags:["writing-organization"],subStrand:"Range of Writing",essential:!0,eqg:"W.11-12.5"},{id:"ID-W-RW-11-12-6",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.RW.6",text:"Develop and strengthen writing as needed by planning, revising, editing, rewriting, or trying a new approach, focusing on reframing points to address specific purposes or needs of the audience. (Editing should demonstrate command of grade-level Grammar and Conventions.)",tags:["writing-process"],subStrand:"Range of Writing",essential:!1},{id:"ID-W-HWK-11-12-7",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.HWK.7",text:"Write by hand or with technology to produce, publish, and update individual or shared writing products in response to ongoing feedback, including new arguments or information.",tags:["handwriting-keyboarding"],subStrand:"Handwriting and Keyboarding",essential:!1},{id:"ID-ODC-OC-11-12-1",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Oral and Digital Communications",code:"11-12.ODC.OC.1",text:"Engage in collaborative discussions about grade-level topics and texts with peers by promoting civil, democratic discussions and decision-making, establishing individual roles, and tracking progress on specific goals; propelling conversations forward by synthesizing comments and ideas of several speakers and responding to diverse perspectives with relevant observations and ideas, resolving contradictions when possible; and determining what additional information is required to deepen the investigation or complete the task.",tags:["collaborative-discussion"],subStrand:"Oral Communications",essential:!0,eqg:"ODC.11-12.1"},{id:"ID-ODC-OC-11-12-2",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Oral and Digital Communications",code:"11-12.ODC.OC.2",text:"Analyze how visual and sound techniques or design (such as special effects, camera angles, and music) carry or influence messages in various media.",tags:["media-analysis"],subStrand:"Oral Communications",essential:!1},{id:"ID-ODC-OC-11-12-3",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Oral and Digital Communications",code:"11-12.ODC.OC.3",text:"Evaluate a speaker\u2019s point of view, reasoning, and use of evidence and rhetoric, assessing the stance, premises, links among ideas, word choice, points of emphasis, and tone used.",tags:["evaluating-speakers"],subStrand:"Oral Communications",essential:!0,eqg:"ODC.11-12.3"},{id:"ID-ODC-OC-11-12-4",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Oral and Digital Communications",code:"11-12.ODC.OC.4",text:"Present information, findings, and supporting evidence orally, conveying a clear and distinct perspective, such that listeners can follow the line of reasoning; ensure alternative or opposing perspectives are addressed; and the organization, development, substance, and style are appropriate to purpose, audience, and a range of formal and informal tasks.",tags:["oral-presentation"],subStrand:"Oral Communications",essential:!1},{id:"ID-ODC-DC-11-12-5",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Oral and Digital Communications",code:"11-12.ODC.DC.5",text:"Demonstrate the responsible and ethical use of information and communication technologies by distinguishing between kinds of information that should and should not be publicly shared and describing the consequences of a poor decision.",tags:["digital-privacy"],subStrand:"Digital Communications",essential:!1},{id:"ID-ODC-DC-11-12-6",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Oral and Digital Communications",code:"11-12.ODC.DC.6",text:"Integrate multiple sources of information presented in diverse digital media to make informed decisions and solve problems, evaluating the credibility and accuracy of each source and noting any discrepancies among the data.",tags:["source-evaluation","integrating-sources"],subStrand:"Digital Communications",essential:!0,eqg:"ODC.11-12.6"},{id:"ID-ODC-DC-11-12-7",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Oral and Digital Communications",code:"11-12.ODC.DC.7",text:"Analyze multiple interpretations of a text (e.g., recorded or live production of a play or recorded novel or poetry), evaluating how each version interprets the source text.",tags:["media-comparison"],subStrand:"Digital Communications",essential:!1},{id:"ID-GC-GU-11-12-1",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.GU.1",text:"Demonstrate command of the conventions of English grammar and usage when writing or speaking.",tags:["usage-conventions"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-11-12-1a",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.GU.1a",text:"Apply the understanding that usage is a matter of convention, can change over time, and is sometimes contested, consulting references (e.g., Merriam-Webster\u2019s Dictionary of English Usage, Garner\u2019s Modern American Usage) as needed.",tags:["usage-conventions"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-11-12-1b",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.GU.1b",text:"Use a variety of sentence structures, including compound and compound-complex sentences with effective coordination and subordination of ideas and parallel, repetitive, and analogous sentence structures.",tags:["sentence-structure"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-11-12-1c",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.GU.1c",text:"Write and edit work so that it conforms to the guidelines in a style manual (e.g., MLA Handbook, Turabian\u2019s Manual for Writers) appropriate for the writing type.",tags:["style-manual"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-GU-11-12-1d",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.GU.1d",text:"Vary syntax for effect, consulting references (e.g., Tufte\u2019s Artful Sentences) for guidance as needed.",tags:["precise-language"],subStrand:"Grammar and Usage",essential:!0,eqg:"GC.11-12.1d"},{id:"ID-GC-GU-11-12-1e",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.GU.1e",text:"Adapt speech to a variety of contexts and tasks, using formal English when appropriate to task and situation; and distinguish where informal discourse is more appropriate.",tags:["formal-english"],subStrand:"Grammar and Usage",essential:!1},{id:"ID-GC-M-11-12-2",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.M.2",text:"Demonstrate command of the conventions of English punctuation and capitalization when writing and reading aloud to create meaning.",tags:["punctuation"],subStrand:"Mechanics",essential:!1},{id:"ID-GC-M-11-12-2a",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.M.2a",text:"Reflect appropriate manuscript requirements in writing, including correct use of seriation (headings and subheadings).",tags:["style-manual"],subStrand:"Mechanics",essential:!1},{id:"ID-GC-M-11-12-3",state:"Idaho",stateAbbr:"ID",grade:"11-12",gradesCovered:[11,12],strand:"Grammar and Conventions",code:"11-12.GC.M.3",text:"Spell correctly, consulting reference materials to check as needed.",tags:["spelling"],subStrand:"Mechanics",essential:!1},{id:"OK-9-1-S-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Oral and Digital Communications",code:"9.1.S.1",text:"work effectively and respectfully in diverse groups by showing willingness to make necessary compromises to accomplish a goal, sharing responsibility for collaborative work, and recognizing individual contributions",tags:["speaking-listening","collaborative-discussion"],subStrand:"Speaking and Listening"},{id:"OK-9-1-S-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Oral and Digital Communications",code:"9.1.S.2",text:"follow agreed-upon rules as they engage in collaborative discussions about what they are reading and writing, expressing their own ideas clearly, building on the ideas of others, and respectfully disagreeing when necessary in pairs, diverse groups, and whole-class settings.",tags:["collaborative-discussion"],subStrand:"Speaking and Listening"},{id:"OK-9-1-S-3",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Oral and Digital Communications",code:"9.1.S.3",text:"conduct formal and informal presentations in a variety of contexts supporting their message with evidence and using verbal and nonverbal cues. g processes.",tags:["oral-presentation","speaking-listening"],subStrand:"Speaking and Listening"},{id:"OK-9-2-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.2.R.1",text:"summarize the main ideas and paraphrase significant parts of increasingly complex texts.",tags:["central-idea"],subStrand:"Reading and Writing Process"},{id:"OK-9-2-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.2.R.2",text:"identify characteristics of genres and analyze how they enhance comprehension of fiction, poetry, drama, and nonfiction.",tags:["genre-characteristics"],subStrand:"Reading and Writing Process"},{id:"OK-9-2-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.2.W.1",text:"routinely and recursively prewrite (e.g., develop and organize ideas).",tags:["writing-process"],subStrand:"Reading and Writing Process"},{id:"OK-9-2-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.2.W.2",text:"routinely and recursively develop drafts, applying organizational structure(s) (e.g., description, compare/contrast, sequential, problem/solution, cause/effect, etc.).",tags:["writing-process","writing-organization"],subStrand:"Reading and Writing Process"},{id:"OK-9-2-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.2.W.3",text:"routinely and recursively revise drafts for organization, transitions, sentence variety, and consistent tone and point of view in order to improve coherence and meaning.",tags:["writing-process"],subStrand:"Reading and Writing Process"},{id:"OK-9-2-W-4",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.2.W.4",text:"routinely and recursively use resources to edit for grammar, usage, mechanics, and format in order to finalize drafts for publication.",tags:["writing-process"],subStrand:"Reading and Writing Process"},{id:"OK-9-2-W-5",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.2.W.5",text:"routinely and recursively publish final drafts for an authentic audience (e.g., publishing digitally, community and professional audiences, newspapers and magazines, entering contests).",tags:["writing-process","handwriting-keyboarding"],subStrand:"Reading and Writing Process"},{id:"OK-9-3-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.R.1",text:"analyze the extent to which historical, cultural, and/or global perspectives affect authors\u2019 stylistic choices in grade-level literary and informational texts.",tags:["point-of-view"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.R.2",text:"evaluate authors\u2019 perspectives and explain how those perspectives contribute to the meanings of texts.",tags:["point-of-view"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-R-3",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.R.3",text:"evaluate how literary elements impact theme, mood, and/or tone, using textual evidence: \u25CF setting \u25CF plot structure (e.g., foreshadowing, flashback, in media res) \u25CF conflict (i.e., internal, external) \u25CF characters (e.g., protagonist, antagonist) \u25CF characterization (i.e., direct, indirect) \u25CF point of view (e.g., narrator reliability) \u25CF archetypes",tags:["lit-text-structure","theme-development"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-R-4",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.R.4",text:"evaluate how literary devices impact theme, mood, and/or tone, using textual evidence: \u25CF figurative language (i.e., simile, metaphor, personification, hyperbole, imagery, symbolism) \u25CF sound devices (i.e., onomatopoeia, alliteration, assonance) \u25CF irony (i.e., verbal, situational, dramatic)",tags:["figurative-language","theme-development"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-R-5",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.R.5",text:"evaluate the validity of a speaker\u2019s argument: \u25CF distinguish the kinds of evidence (e.g., logical, empirical, anecdotal) \u25CF distinguish substantiated from unsubstantiated claims \u25CF analyze rhetorical appeals (i.e., ethos, logos, pathos) \u25CF identify bias \u25CF identify logical fallacies",tags:["argument-evaluation","evaluating-speakers"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-R-6",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.R.6",text:"analyze how informational text structures support the author\u2019s purpose.",tags:["nonfiction-text-structure"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-R-7",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.R.7",text:"analyze how two or more texts address similar themes or topics, using textual evidence to support their claims and inferences.",tags:["comparing-texts","textual-evidence"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.W.1",text:"compose narratives reflecting real or imagined experiences that: \u25CF include engaging plots involving well-developed, complex characters resolving conflicts \u25CF establish narrator(s) that enhance(s) the narrative \u25CF are intentionally sequenced in a way to achieve a specific effect (e.g., create suspense, establish mood, reflect theme) \u25CF provide clear descriptions, using precise language, sensory details, and dialogue \u25CF include varied syntax to enhance readability \u25CF emulate literary elements and/or literary devices from mentor texts",tags:["narrative-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.W.2",text:"compose informative essays, reports, or technical writing that: \u25CF objectively introduce and develop topics \u25CF include a defensible thesis \u25CF incorporate evidence (e.g., specific facts, details, charts and graphs, data) \u25CF maintain an organized structure \u25CF use sentence variety and word choice to create clarity and concision \u25CF establish and maintain a formal style \u25CF emulate literary devices from mentor texts",tags:["informational-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.W.3",text:"compose argumentative essays, reviews, or op-eds that: \u25CF introduce precise, informed claims \u25CF include a defensible thesis \u25CF acknowledge counterclaims or alternate perspectives \u25CF organize claims, counterclaims, and evidence in a logical sequence \u25CF provide the most relevant evidence to develop balanced arguments, using credible sources \u25CF use sentence variety and word choice to create clarity and concision \u25CF use style and tone that suits the audience and purpose",tags:["argument-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-9-3-W-4",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Reading Comprehension",code:"9.3.W.4",text:"blend narrative, informative, and argumentative writing to suit their audience and purpose.",tags:["range-of-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-9-4-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Vocabulary Development",code:"9.4.R.1",text:"analyze the relationships among synonyms, antonyms, and analogies.",tags:["word-nuance"],subStrand:"Vocabulary"},{id:"OK-9-4-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Vocabulary Development",code:"9.4.R.2",text:"use context clues, connotation, and denotation to determine or clarify the meaning of words or distinguish among multiple-meaning words.",tags:["context-clues","word-nuance"],subStrand:"Vocabulary"},{id:"OK-9-4-R-3",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Vocabulary Development",code:"9.4.R.3",text:"use word parts (e.g., affixes, Anglo-Saxon, Greek, and Latin roots, stems) to define and determine the meaning of increasingly complex words.",tags:["word-patterns"],subStrand:"Vocabulary"},{id:"OK-9-4-R-4",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Vocabulary Development",code:"9.4.R.4",text:"use resources (e.g., dictionary, glossary, thesaurus, etc.) to determine or clarify the meanings, syllabication, pronunciation, synonyms, parts of speech, and etymology of words or phrases.",tags:["reference-materials"],subStrand:"Vocabulary"},{id:"OK-9-4-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Vocabulary Development",code:"9.4.W.1",text:"use precise, grade-level vocabulary in writing to clearly communicate complex ideas.",tags:["academic-vocabulary"],subStrand:"Vocabulary"},{id:"OK-9-4-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Vocabulary Development",code:"9.4.W.2",text:"select language to create a specific effect in writing according to purpose and audience.",tags:["word-choice-impact"],subStrand:"Vocabulary"},{id:"OK-9-5-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Grammar and Conventions",code:"9.5.R.1",text:"recognize and examine the effect of parallel structure and active and passive voice to convey specific meanings.",tags:["sentence-structure","voice-and-mood"],subStrand:"Language"},{id:"OK-9-5-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Grammar and Conventions",code:"9.5.R.2",text:"recognize noun, verb, adjectival, and adverbial phrases and explain their effect in particular sentences.",tags:["sentence-structure"],subStrand:"Language"},{id:"OK-9-5-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Grammar and Conventions",code:"9.5.W.1",text:"use or revise for active/passive voice and parallel structure in words and phrases for effect.",tags:["voice-and-mood","sentence-structure"],subStrand:"Language"},{id:"OK-9-5-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"9",gradesCovered:[9],strand:"Grammar and Conventions",code:"9.5.W.2",text:"add clarity, variety, and/or style to their writing and presentations with parts of speech and various types of phrases and clauses.",tags:["sentence-structure"],subStrand:"Language"},{id:"OK-9-5-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"9",gra quiry-process"],subStrand:"Research"},{id:"OK-10-6-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"10",gradesCovered:[10],strand:"Research",code:"10.6.R.2",text:"synthesize relevant information from a variety of primary and secondary sources, following ethical and legal citation guidelines.",tags:["integrating-sources","citation-format"],subStrand:"Research"},{id:"OK-10-6-R-3",state:"Oklahoma",stateAbbr:"OK",grade:"10",gradesCovered:[10],strand:"Research",code:"10.6.R.3",text:"evaluate the relevance, reliability, and validity of the information gathered.",tags:["source-evaluation"],subStrand:"Research"},{id:"OK-10-6-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"10",gradesCovered:[10],strand:"Research",code:"10.6.W.1",text:"formulate and refine a viable research question.",tags:["inquiry-process"],subStrand:"Research"},{id:"OK-10-6-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"10",gradesCovered:[10],strand:"Research",code:"10.6.W.2",text:"develop a clear, concise, defensible thesis statement.",tags:["informational-writing"],subStrand:"Research"},{id:"OK-10-6-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"10",gradesCovered:[10],strand:"Research",code:"10.6.W.3",text:"integrate quotes, paraphrases, and summaries from research, following a consistent citation style (e.g., MLA, APA) to avoid plagiarism.",tags:["citation-format"],subStrand:"Research"},{id:"OK-10-6-W-4",state:"Oklahoma",stateAbbr:"OK",grade:"10",gradesCovered:[10],strand:"Research",code:"10.6.W.4",text:"present research in longer formats (e.g., sustained research projects, process essays) and shorter, informal formats (e.g., single-day research projects, informal discussion) to a variety of audiences.",tags:["inquiry-process","oral-presentation"],subStrand:"Research"},{id:"OK-10-7-R",state:"Oklahoma",stateAbbr:"OK",grade:"10",gradesCovered:[10],strand:"Oral and Digital Communications",code:"10.7.R",text:"analyze and evaluate the techniques used in a variety of multimodal content and how they contribute to meaning.",t ["collaborative-discussion"],subStrand:"Speaking and Listening"},{id:"OK-11-1-S-3",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Oral and Digital Communications",code:"11.1.S.3",text:"conduct formal and informal presentations in a variety of contexts supporting their message with evidence and using verbal and nonverbal cues. g processes.",tags:["oral-presentation","speaking-listening"],subStrand:"Speaking and Listening"},{id:"OK-11-2-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Reading Comprehension",code:"11.2.R.1",text:"summarize the main ideas and paraphrase significant parts of increasingly complex texts.",tags:["central-idea"],subStrand:"Reading and Writing Process"},{id:"OK-11-2-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Reading Comprehension",code:"11.2.R.2",text:"identify characteristics of genres and analyze how they enhance comprehension of fiction, poetry, drama, and nonfiction.",tags:["genre-characteristics"],subStrand:"Reading and Writing Process"},{id:"OK-11-2-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Reading Comprehension",code:"11.2.W.1",text:"routinely and recursively prewrite (e.g., develop and organize ideas).",tags:["writing-process"],subStrand:"Reading and Writing Process"},{id:"OK-11-2-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Reading Comprehension",code:"11.2.W.2",text:"routinely and recursively develop drafts, applying organizational structure(s) (e.g., description, compare/contrast, sequential, problem/solution, cause/effect, etc.).",tags:["writing-process","writing-organization"],subStrand:"Reading and Writing Process"},{id:"OK-11-2-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Reading Comprehension",code:"11.2.W.3",text:"routinely and recursively revise drafts for organization, transitions, sentence variety, and consistent tone and point of view in order to impr ma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Research",code:"11.6.R.3",text:"evaluate the relevance, reliability, and validity of the information gathered.",tags:["source-evaluation"],subStrand:"Research"},{id:"OK-11-6-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Research",code:"11.6.W.1",text:"formulate and refine a viable research question.",tags:["inquiry-process"],subStrand:"Research"},{id:"OK-11-6-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Research",code:"11.6.W.2",text:"develop a clear, concise, defensible thesis statement.",tags:["informational-writing"],subStrand:"Research"},{id:"OK-11-6-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Research",code:"11.6.W.3",text:"integrate quotes, paraphrases, and summaries from research, following a consistent citation style (e.g., MLA, APA) to avoid plagiarism.",tags:["citation-format"],subStrand:"Research"},{id:"OK-11-6-W-4",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Research",code:"11.6.W.4",text:"present research in longer formats (e.g., sustained research projects, process essays) and shorter, informal formats (e.g., single-day research projects, informal discussion) to a variety of audiences.",tags:["inquiry-process","oral-presentation"],subStrand:"Research"},{id:"OK-11-7-R",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Oral and Digital Communications",code:"11.7.R",text:"analyze and evaluate the techniques used in a variety of multimodal content and how they contribute to meaning.",tags:["multimodal-literacies","media-analysis"],subStrand:"Multimodal Literacies"},{id:"OK-11-7-W",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Oral and Digital Communications",code:"11.7.W",text:"create engaging multimodal content that intentionally enhances understanding of findings, reasoning, and evidence for diverse audiences.",tags:["multimodal-literacies","digital-media-use"],subStrand:"Multimodal Literacies"},{id:"OK-11-8-R",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Reading Comprehension",code:"11.8.R",text:"select texts for specific purposes and read independently for extended periods of time.",tags:["independent-reading","volume-of-reading"],subStrand:"Independent Reading and Writing"},{id:"OK-11-8-W",state:"Oklahoma",stateAbbr:"OK",grade:"11",gradesCovered:[11],strand:"Reading Comprehension",code:"11.8.W",text:"write independently using print, cursive, and/or typing for various lengths of time, intentionally selecting and combining modes and genres to suit their audiences and purposes.",tags:["independent-reading","range-of-writing"],subStrand:"Independent Reading and Writing"},{id:"OK-12-1-S-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Oral and Digital Communications",code:"12.1.S.1",text:"work effectively and respectfully in diverse groups by showing willingness to make necessary compromises to accomplish a goal, sharing responsibility for collaborative work, and recognizing individual contributions",tags:["speaking-listening","collaborative-discussion"],subStrand:"Speaking and Listening"},{id:"OK-12-1-S-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Oral and Digital Communications",code:"12.1.S.2",text:"follow agreed-upon rules as they engage in collaborative discussions about what they are reading and writing, expressing their own ideas clearly, building on the ideas of others, and respectfully disagreeing when necessary in pairs, diverse groups, and whole-class settings.",tags:["collaborative-discussion"],subStrand:"Speaking and Listening"},{id:"OK-12-1-S-3",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Oral and Digital Communications",code:"12.1.S.3",text:"conduct formal and informal presentations in a variety of contexts supporting their message with evidence and using verbal and nonverbal cues. g processes.",tags:["oral-presentation","speaking-listening"],subStrand:"Speaking and Listening"},{id:"OK-12-2-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.2.R.1",text:"summarize the main ideas and paraphrase significant parts of increasingly complex texts.",tags:["central-idea"],subStrand:"Reading and Writing Process"},{id:"OK-12-2-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.2.R.2",text:"identify characteristics of genres and analyze how they enhance comprehension of fiction, poetry, drama, and nonfiction.",tags:["genre-characteristics"],subStrand:"Reading and Writing Process"},{id:"OK-12-2-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.2.W.1",text:"routinely and recursively prewrite (e.g., develop and organize ideas).",tags:["writing-process"],subStrand:"Reading and Writing Process"},{id:"OK-12-2-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.2.W.2",text:"routinely and recursively develop drafts, applying organizational structure(s) (e.g., description, compare/contrast, sequential, problem/solution, cause/effect, etc.).",tags:["writing-process","writing-organization"],subStrand:"Reading and Writing Process"},{id:"OK-12-2-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.2.W.3",text:"routinely and recursively revise drafts for organization, transitions, sentence variety, and consistent tone and point of view in order to improve coherence and meaning.",tags:["writing-process"],subStrand:"Reading and Writing Process"},{id:"OK-12-2-W-4",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.2.W.4",text:"routinely and recursively use resources to edit for grammar, usage, mechanics, and format in order to finalize drafts for publication.",tags:["writing-process"],subStrand:"Reading and Writing Process"},{id:"OK-12-2-W-5",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.2.W.5",text:"routinely and recursively publish final drafts for an authentic audience (e.g., publishing digitally, community and professional audiences, newspapers and magazines, entering contests).",tags:["writing-process","handwriting-keyboarding"],subStrand:"Reading and Writing Process"},{id:"OK-12-3-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.R.1",text:"analyze the extent to which historical, cultural, and/or global perspectives affect authors\u2019 stylistic choices in grade-level literary and informational texts.",tags:["point-of-view"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.R.2",text:"evaluate authors\u2019 perspectives and explain how those perspectives contribute to the meanings of texts.",tags:["point-of-view"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-R-3",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.R.3",text:"evaluate how literary elements impact theme, mood, and/or tone, using textual evidence: \u25CF setting \u25CF plot structure (e.g., foreshadowing, flashback, in media res) \u25CF conflict (i.e., internal, external) \u25CF characters (e.g., protagonist, antagonist) \u25CF characterization (i.e., direct, indirect) \u25CF point of view (e.g., narrator reliability) \u25CF archetypes",tags:["lit-text-structure","theme-development"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-R-4",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.R.4",text:"evaluate how literary devices impact theme, mood, and/or tone, using textual evidence: \u25CF figurative language (i.e., simile, metaphor, personification, hyperbole, imagery, symbolism) \u25CF sound devices (i.e., onomatopoeia, alliteration, assonance) \u25CF irony (i.e., verbal, situational, dramatic)",tags:["figurative-language","theme-development"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-R-5",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.R.5",text:"evaluate how authors writing on the same issue reached different conclusions because of differences in assumptions, evidence, reasoning, and viewpoints, including examining rhetorical appeals, bias, and use of logical fallacies.",tags:["argument-evaluation","evaluating-speakers"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-R-6",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.R.6",text:"analyze how informational text structures support the author\u2019s purpose.",tags:["nonfiction-text-structure"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-R-7",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.R.7",text:"evaluate how two or more texts address similar themes or topics, using textual evidence to support their claims and inferences.",tags:["comparing-texts","textual-evidence"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.W.1",text:"compose narratives reflecting real or imagined experiences that: \u25CF include engaging plots involving well-developed, complex characters resolving conflicts \u25CF establish narrator(s) that enhance(s) the narrative \u25CF are intentionally sequenced in a way to achieve a specific effect (e.g., create suspense, establish mood, reflect theme) \u25CF provide clear descriptions, using precise language, sensory details, and dialogue \u25CF include varied syntax to enhance readability \u25CF emulate literary elements and/or literary devices from mentor texts",tags:["narrative-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.W.2",text:"compose informative essays, reports, or technical writing that: \u25CF objectively introduce and develop topics \u25CF include a defensible thesis \u25CF incorporate evidence (e.g., specific facts, details, charts and graphs, data) \u25CF maintain an organized structure \u25CF use sentence variety and word choice to create clarity and concision \u25CF establish and maintain a formal style \u25CF emulate literary devices from mentor texts",tags:["informational-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.W.3",text:"compose argumentative essays, reviews, or op-eds that: \u25CF introduce precise, informed claims \u25CF include a defensible thesis \u25CF acknowledge counterclaims or alternate perspectives \u25CF organize claims, counterclaims, and evidence in a logical sequence \u25CF provide the most relevant evidence to develop balanced arguments, using credible sources \u25CF use sentence variety and word choice to create clarity and concision \u25CF use style and tone that suits the audience and purpose",tags:["argument-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-12-3-W-4",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.3.W.4",text:"blend narrative, informative, and argumentative writing to suit their audience and purpose.",tags:["range-of-writing"],subStrand:"Critical Reading and Writing"},{id:"OK-12-4-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Vocabulary Development",code:"12.4.R.1",text:"analyze the relationships among synonyms, antonyms, and analogies.",tags:["word-nuance"],subStrand:"Vocabulary"},{id:"OK-12-4-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Vocabulary Development",code:"12.4.R.2",text:"use context clues, connotation, and denotation to determine or clarify the meaning of words or distinguish among multiple-meaning words.",tags:["context-clues","word-nuance"],subStrand:"Vocabulary"},{id:"OK-12-4-R-3",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Vocabulary Development",code:"12.4.R.3",text:"use word parts (e.g., affixes, Anglo-Saxon, Greek, and Latin roots, stems) to define and determine the meaning of increasingly complex words.",tags:["word-patterns"],subStrand:"Vocabulary"},{id:"OK-12-4-R-4",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Vocabulary Development",code:"12.4.R.4",text:"use resources (e.g., dictionary, glossary, thesaurus, etc.) to determine or clarify the meanings, syllabication, pronunciation, synonyms, parts of speech, and etymology of words or phrases.",tags:["reference-materials"],subStrand:"Vocabulary"},{id:"OK-12-4-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Vocabulary Development",code:"12.4.W.1",text:"use precise, grade-level vocabulary in writing to clearly communicate complex ideas.",tags:["academic-vocabulary"],subStrand:"Vocabulary"},{id:"OK-12-4-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Vocabulary Development",code:"12.4.W.2",text:"select language to create a specific effect in writing according to purpose and audience.",tags:["word-choice-impact"],subStrand:"Vocabulary"},{id:"OK-12-5-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Grammar and Conventions",code:"12.5.R.1",text:"apply their knowledge of syntax (e.g., parallel structure, active and passive voice, and phrases/clauses) to analyze and evaluate a variety of texts, understanding that usage and convention change over time.",tags:["sentence-structure","voi s.",tags:["punctuation"],subStrand:"Language"},{id:"OK-12-5-W-7",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Grammar and Conventions",code:"12.5.W.7",text:"use a colon or dash to reveal information in a sentence.",tags:["punctuation"],subStrand:"Language"},{id:"OK-12-5-W-8",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Grammar and Conventions",code:"12.5.W.8",text:"use an ellipsis to indicate omission from quoted material and brackets to indicate an addition or clarification to quoted material.",tags:["punctuation"],subStrand:"Language"},{id:"OK-12-5-W-9",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Grammar and Conventions",code:"12.5.W.9",text:"write using correct italics mechanics.",tags:["punctuation"],subStrand:"Language"},{id:"OK-12-5-W-10",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Grammar and Conventions",code:"12.5.W.10",text:"write using correct semicolon mechanics.",tags:["punctuation"],subStrand:"Language"},{id:"OK-12-6-R-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Research",code:"12.6.R.1",text:"find and comprehend information about a topic, using their own viable research questions.",tags:["inquiry-process"],subStrand:"Research"},{id:"OK-12-6-R-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Research",code:"12.6.R.2",text:"synthesize relevant information from a variety of primary and secondary sources, following ethical and legal citation guidelines.",tags:["integrating-sources","citation-format"],subStrand:"Research"},{id:"OK-12-6-R-3",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Research",code:"12.6.R.3",text:"evaluate the relevance, reliability, and validity of the information gathered.",tags:["source-evaluation"],subStrand:"Research"},{id:"OK-12-6-W-1",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Research",code:"12.6.W.1",text:"formulate and refine a viable research question.",tags:["inquiry-process"],subStrand:"Research"},{id:"OK-12-6-W-2",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Research",code:"12.6.W.2",text:"develop a clear, concise, defensible thesis statement.",tags:["informational-writing"],subStrand:"Research"},{id:"OK-12-6-W-3",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Research",code:"12.6.W.3",text:"integrate quotes, paraphrases, and summaries from research, following a consistent citation style (e.g., MLA, APA) to avoid plagiarism.",tags:["citation-format"],subStrand:"Research"},{id:"OK-12-6-W-4",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Research",code:"12.6.W.4",text:"present research in longer formats (e.g., sustained research projects, process essays) and shorter, informal formats (e.g., single-day research projects, informal discussion) to a variety of audiences.",tags:["inquiry-process","oral-presentation"],subStrand:"Research"},{id:"OK-12-7-R",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Oral and Digital Communications",code:"12.7.R",text:"analyze and evaluate the techniques used in a variety of multimodal content and how they contribute to meaning.",tags:["multimodal-literacies","media-analysis"],subStrand:"Multimodal Literacies"},{id:"OK-12-7-W",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Oral and Digital Communications",code:"12.7.W",text:"create engaging multimodal content that intentionally enhances understanding of findings, reasoning, and evidence for diverse audiences.",tags:["multimodal-literacies","digital-media-use"],subStrand:"Multimodal Literacies"},{id:"OK-12-8-R",state:"Oklahoma",stateAbbr:"OK",grade:"12",gradesCovered:[12],strand:"Reading Comprehension",code:"12.8.R",text:"select texts for specific purposes and read independently for extended periods of time.",tags:["independent-reading","volume-of-reading"],subStrand:"Independent Reading and
