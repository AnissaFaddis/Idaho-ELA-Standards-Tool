icular style guide.",tags:["integrating-sources","citation-format"],subStrand:"Grade-Specific Content Standards"},{id:"AL-12-29",state:"Alabama",stateAbbr:"AL",grade:"12",gradesCovered:[12],strand:"Research Literacy",code:"ELA.12.29",text:"Compose clear, coherent writing that incorporates information from a variety of scholarly and non-scholarly sources and demonstrates a clear position on a topic, answers a research question, or presents a solution to a problem.",tags:["informational-writing","integrating-sources"],subStrand:"Grade-Specific Content Standards"},{id:"AL-12-30",state:"Alabama",stateAbbr:"AL",grade:"12",gradesCovered:[12],strand:"Research Literacy",code:"ELA.12.30",text:"Synthesize research using responsible and ethical practices to create and orally present clear, coherent products demonstrating command of language that is suitable for the target audience and purpose.",tags:["oral-presentation","inquiry-process"],subStrand:"Grade-Specific Content Standards"},{id:"AL-REC-R1",state:"Alabama",stateAbbr:"AL",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Recurring Standards",code:"ELA.9-12.R1",text:"Read a variety of print and nonprint documents to acquire new information and respond to the needs and demands of society and the workplace.",tags:["independent-reading","volume-of-reading"],subStrand:"Recurring Standards"},{id:"AL-REC-R2",state:"Alabama",stateAbbr:"AL",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Recurring Standards",code:"ELA.9-12.R2",text:"Read and comprehend a variety of literary texts to develop a literal and figurative understanding as appropriate to the type of text, purpose, and situation.",tags:["independent-reading","lit-evidence-understanding"],subStrand:"Recurring Standards"},{id:"AL-REC-R3",state:"Alabama",stateAbbr:"AL",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Recurring Standards",code:"ELA.9-12.R3",text:"Utilize active listening skills in formal and informal conversations, following predetermined norms.",tags:["speaking-listening","collaborative-discussion"],subStrand:"Recurring Standards"},{id:"AL-REC-R4",state:"Alabama",stateAbbr:"AL",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Recurring Standards",code:"ELA.9-12.R4",text:"Use digital and electronic tools appropriately, safely, and ethically.",tags:["digital-privacy","digital-media-use"],subStrand:"Recurring Standards"},{id:"AL-REC-R5",state:"Alabama",stateAbbr:"AL",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Recurring Standards",code:"ELA.9-12.R5",text:"Utilize a writing process which includes planning, revising, editing/peer-editing, and rewriting to create a focused, organized, and coherent piece of writing for a specific purpose and audience.",tags:["writing-process"],subStrand:"Recurring Standards"},{id:"AL-REC-R6",state:"Alabama",stateAbbr:"AL",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Recurring Standards",code:"ELA.9-12.R6",text:"Employ conventions of grammar, mechanics, and usage in order to communicate effectively with a target audience.",tags:["usage-conventions","punctuation"],subStrand:"Recurring Standards"},{id:"AL-REC-R7",state:"Alabama",stateAbbr:"AL",grade:"9-12",gradesCovered:[9,10,11,12],strand:"Recurring Standards",code:"ELA.9-12.R7",text:"Use context clues to determine meanings of unfamiliar spoken or written words.",tags:["context-clues"],subStrand:"Recurring Standards"},{id:"MI-RL-9-10-1",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.1",text:"Cite strong and thorough textual evidence to support analysis of what the text says explicitly as well as inferences drawn from the text.",tags:["textual-evidence","lit-evidence-understanding"],subStrand:"Key Ideas and Details"},{id:"MI-RL-9-10-2",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.2",text:"Determine a theme or central idea of a text and analyze in detail its development over the course of the text, including how it emerges and is shaped and refined by specific details; provide an objective summary of the text.",tags:["theme-development"],subStrand:"Key Ideas and Details"},{id:"MI-RL-9-10-3",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.3",text:"Analyze how complex characters (e.g., those with multiple or conflicting motivations) develop over the course of a text, interact with other characters, and advance the plot or develop the theme.",tags:["character-development"],subStrand:"Key Ideas and Details"},{id:"MI-RL-9-10-4",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.4",text:"Determine the meaning of words and phrases as they are used in the text, including figurative and connotative meanings; analyze the cumulative impact of specific word choices on meaning and tone (e.g., how the language evokes a sense of time and place; how it sets a formal or informal tone).",tags:["figurative-language","word-choice-impact"],subStrand:"Craft and Structure"},{id:"MI-RL-9-10-5",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.5",text:"Analyze how an author's choices concerning how to structure a text, order events within it (e.g., parallel plots), and manipulate time (e.g., pacing, flashbacks) create such effects as mystery, tension, or surprise.",tags:["lit-text-structure"],subStrand:"Craft and Structure"},{id:"MI-RL-9-10-6",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.6",text:"Analyze a particular point of view or cultural experience reflected in a work of literature from outside the United States, drawing on a wide reading of world literature.",tags:["point-of-view"],subStrand:"Craft and Structure"},{id:"MI-RL-9-10-7",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.7",text:"Analyze the representation of a subject or a key scene in two different artistic mediums, including what is emphasized or absent in each treatment (e.g., Auden's \u201CMus\xE9e des Beaux Arts\u201D and Breughel's Landscape with the Fall of Icarus).",tags:["multiple-interpretations","media-comparison"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RL-9-10-9",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.9",text:"Analyze how an author draws on and transforms source material in a specific work (e.g., how Shakespeare treats a theme or topic from Ovid or the Bible or how a later author draws on a play by Shakespeare).",tags:["comparing-texts","canonical-author-requirement"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RL-9-10-10",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Literature",code:"RL.9-10.10",text:"By the end of grade 9, read and comprehend literature, including stories, dramas, and poems, in the grades 9\u201310 text complexity band proficiently, with scaffolding as needed at the high end of the range. By the end of grade 10, read and comprehend literature, including stories, dramas, and poems, at the high end of the grades 9\u201310 text complexity band independently and proficiently.",tags:["text-complexity","independent-reading"],subStrand:"Range of Reading and Level of Text Complexity"},{id:"MI-RL-11-12-1",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.1",text:"Cite strong and thorough textual evidence to support analysis of what the text says explicitly as well as inferences drawn from the text, including determining where the text leaves matters uncertain.",tags:["textual-evidence","lit-evidence-understanding"],subStrand:"Key Ideas and Details"},{id:"MI-RL-11-12-2",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.2",text:"Determine two or more themes or central ideas of a text and analyze their development over the course of the text, including how they interact and build on one another to produce a complex account; provide an objective summary of the text.",tags:["theme-development"],subStrand:"Key Ideas and Details"},{id:"MI-RL-11-12-3",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.3",text:"Analyze the impact of the author's choices regarding how to develop and relate elements of a story or drama (e.g., where a story is set, how the action is ordered, how the characters are introduced and developed).",tags:["character-development","lit-text-structure"],subStrand:"Key Ideas and Details"},{id:"MI-RL-11-12-4",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.4",text:"Determine the meaning of words and phrases as they are used in the text, including figurative and connotative meanings; analyze the impact of specific word choices on meaning and tone, including words with multiple meanings or language that is particularly fresh, engaging, or beautiful. (Include Shakespeare as well as other authors.)",tags:["figurative-language","word-choice-impact","canonical-author-requirement"],subStrand:"Craft and Structure"},{id:"MI-RL-11-12-5",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.5",text:"Analyze how an author's choices concerning how to structure specific parts of a text (e.g., the choice of where to begin or end a story, the choice to provide a comedic or tragic resolution) contribute to its overall structure and meaning as well as its aesthetic impact.",tags:["lit-text-structure"],subStrand:"Craft and Structure"},{id:"MI-RL-11-12-6",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.6",text:"Analyze a case in which grasping point of view requires distinguishing what is directly stated in a text from what is really meant (e.g., satire, sarcasm, irony, or understatement).",tags:["authorial-intent","point-of-view"],subStrand:"Craft and Structure"},{id:"MI-RL-11-12-7",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.7",text:"Analyze multiple interpretations of a story, drama, or poem (e.g., recorded or live production of a play or recorded novel or poetry), evaluating how each version interprets the source text. (Include at least one play by Shakespeare and one play by an American dramatist.)",tags:["multiple-interpretations","canonical-author-requirement"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RL-11-12-9",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.9",text:"Demonstrate knowledge of eighteenth-, nineteenth- and early-twentieth-century foundational works of American literature, including how two or more texts from the same period treat similar themes or topics.",tags:["seminal-documents","comparing-texts"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RL-11-12-10",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Literature",code:"RL.11-12.10",text:"By the end of grade 11, read and comprehend literature, including stories, dramas, and poems, in the grades 11\u2013CCR text complexity band proficiently, with scaffolding as needed at the high end of the range. By the end of grade 12, read and comprehend literature, including stories, dramas, and poems, at the high end of the grades 11\u2013CCR text complexity band independently and proficiently.",tags:["text-complexity","independent-reading"],subStrand:"Range of Reading and Level of Text Complexity"},{id:"MI-RI-9-10-1",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.1",text:"Cite strong and thorough textual evidence to support analysis of what the text says explicitly as well as inferences drawn from the text.",tags:["textual-evidence","nonfiction-evidence-understanding"],subStrand:"Key Ideas and Details"},{id:"MI-RI-9-10-2",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.2",text:"Determine a central idea of a text and analyze its development over the course of the text, including how it emerges and is shaped and refined by specific details; provide an objective summary of the text.",tags:["central-idea"],subStrand:"Key Ideas and Details"},{id:"MI-RI-9-10-3",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.3",text:"Analyze how the author unfolds an analysis or series of ideas or events, including the order in which the points are made, how they are introduced and developed, and the connections that are drawn between them.",tags:["analysis-of-ideas"],subStrand:"Key Ideas and Details"},{id:"MI-RI-9-10-4",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.4",text:"Determine the meaning of words and phrases as they are used in a text, including figurative, connotative, and technical meanings; analyze the cumulative impact of specific word choices on meaning and tone (e.g., how the language of a court opinion differs from that of a newspaper).",tags:["word-choice-impact","figurative-language"],subStrand:"Craft and Structure"},{id:"MI-RI-9-10-5",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.5",text:"Analyze in detail how an author's ideas or claims are developed and refined by particular sentences, paragraphs, or larger portions of a text (e.g., a section or chapter).",tags:["nonfiction-text-structure","analysis-of-ideas"],subStrand:"Craft and Structure"},{id:"MI-RI-9-10-6",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.6",text:"Determine an author's point of view or purpose in a text and analyze how an author uses rhetoric to advance that point of view or purpose.",tags:["point-of-view","rhetorical-analysis"],subStrand:"Craft and Structure"},{id:"MI-RI-9-10-7",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.7",text:"Analyze various accounts of a subject told in different mediums (e.g., a person's life story in both print and multimedia), determining which details are emphasized in each account.",tags:["media-comparison","media-analysis"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RI-9-10-8",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.8",text:"Delineate and evaluate the argument and specific claims in a text, assessing whether the reasoning is valid and the evidence is relevant and sufficient; identify false statements and fallacious reasoning.",tags:["argument-evaluation"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RI-9-10-9",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.9",text:"Analyze seminal U.S. documents of historical and literary significance (e.g., Washington's Farewell Address, the Gettysburg Address, Roosevelt's Four Freedoms speech, King's \u201CLetter from Birmingham Jail\u201D), including how they address related themes and concepts.",tags:["seminal-documents","comparing-texts"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RI-9-10-10",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Reading: Informational Text",code:"RI.9-10.10",text:"By the end of grade 9, read and comprehend literary nonfiction in the grades 9\u201310 text complexity band proficiently, with scaffolding as needed at the high end of the range. By the end of grade 10, read and comprehend literary nonfiction at the high end of the grades 9\u201310 text complexity band independently and proficiently.",tags:["text-complexity","independent-reading"],subStrand:"Range of Reading and Level of Text Complexity"},{id:"MI-RI-11-12-1",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.1",text:"Cite strong and thorough textual evidence to support analysis of what the text says explicitly as well as inferences drawn from the text, including determining where the text leaves matters uncertain.",tags:["textual-evidence","nonfiction-evidence-understanding"],subStrand:"Key Ideas and Details"},{id:"MI-RI-11-12-2",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.2",text:"Determine two or more central ideas of a text and analyze their development over the course of the text, including how they interact and build on one another to provide a complex analysis; provide an objective summary of the text.",tags:["central-idea"],subStrand:"Key Ideas and Details"},{id:"MI-RI-11-12-3",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.3",text:"Analyze a complex set of ideas or sequence of events and explain how specific individuals, ideas, or events interact and develop over the course of the text.",tags:["analysis-of-ideas"],subStrand:"Key Ideas and Details"},{id:"MI-RI-11-12-4",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.4",text:"Determine the meaning of words and phrases as they are used in a text, including figurative, connotative, and technical meanings; analyze how an author uses and refines the meaning of a key term or terms over the course of a text (e.g., how Madison defines faction in Federalist No. 10).",tags:["word-choice-impact","academic-vocabulary"],subStrand:"Craft and Structure"},{id:"MI-RI-11-12-5",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.5",text:"Analyze and evaluate the effectiveness of the structure an author uses in his or her exposition or argument, including whether the structure makes points clear, convincing, and engaging.",tags:["nonfiction-text-structure","rhetorical-analysis"],subStrand:"Craft and Structure"},{id:"MI-RI-11-12-6",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.6",text:"Determine an author's point of view or purpose in a text in which the rhetoric is particularly effective, analyzing how style and content contribute to the power, persuasiveness, or beauty of the text.",tags:["point-of-view","rhetorical-analysis"],subStrand:"Craft and Structure"},{id:"MI-RI-11-12-7",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.7",text:"Integrate and evaluate multiple sources of information presented in different media or formats (e.g., visually, quantitatively) as well as in words in order to address a question or solve a problem.",tags:["integrating-sources","media-analysis"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RI-11-12-8",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.8",text:"Delineate and evaluate the reasoning in seminal U.S. texts, including the application of constitutional principles and use of legal reasoning (e.g., in U.S. Supreme Court majority opinions and dissents) and the premises, purposes, and arguments in works of public advocacy (e.g., The Federalist, presidential addresses).",tags:["argument-evaluation","seminal-documents","public-advocacy"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RI-11-12-9",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.9",text:"Analyze seventeenth-, eighteenth-, and nineteenth-century foundational U.S. documents of historical and literary significance (including The Declaration of Independence, the Preamble to the Constitution, the Bill of Rights, and Lincoln's Second Inaugural Address) for their themes, purposes, and rhetorical features.",tags:["seminal-documents","rhetorical-analysis"],subStrand:"Integration of Knowledge and Ideas"},{id:"MI-RI-11-12-10",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Reading: Informational Text",code:"RI.11-12.10",text:"By the end of grade 11, read and comprehend literary nonfiction in the grades 11\u2013CCR text complexity band proficiently, with scaffolding as needed at the high end of the range. By the end of grade 12, read and comprehend literary nonfiction at the high end of the grades 11\u2013CCR text complexity band independently and proficiently.",tags:["text-complexity","independent-reading"],subStrand:"Range of Reading and Level of Text Complexity"},{id:"MI-W-9-10-1",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.1",text:"Write arguments to support claims in an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence. a. Introduce precise claim(s), distinguish the claim(s) from alternate or opposing claims, and create an organization that establishes clear relationships among claim(s), counterclaims, reasons, and evidence. b. Develop claim(s) and counterclaims fairly, supplying evidence for each while pointing out the strengths and limitations of both in a manner that anticipates the audience's knowledge level and concerns. c. Use words, phrases, and clauses to link the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, between reasons and evidence, and between claim(s) and counterclaims. d. Establish and maintain a formal style and objective tone while attending to the norms and conventions of the discipline in which they are writing. e. Provide a concluding statement or section that follows from and supports the argument presented.",tags:["argument-writing","writing-organization","formal-english"],subStrand:"Text Types and Purposes"},{id:"MI-W-9-10-2",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.2",text:"Write informative/explanatory texts to examine and convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and analysis of content. a. Introduce a topic; organize complex ideas, concepts, and information to make important connections and distinctions; include formatting (e.g., headings), graphics (e.g., figures, tables), and multimedia when useful to aiding comprehension. b. Develop the topic with well-chosen, relevant, and sufficient facts, extended definitions, concrete details, quotations, or other information and examples appropriate to the audience's knowledge of the topic. c. Use appropriate and varied transitions to link the major sections of the text, create cohesion, and clarify the relationships among complex ideas and concepts. d. Use precise language and domain-specific vocabulary to manage the complexity of the topic. e. Establish and maintain a formal style and objective tone while attending to the norms and conventions of the discipline in which they are writing. f. Provide a concluding statement or section that follows from and supports the information or explanation presented (e.g., articulating implications or the significance of the topic).",tags:["informational-writing","writing-organization","formal-english","precise-language","academic-vocabulary"],subStrand:"Text Types and Purposes"},{id:"MI-W-9-10-3",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.3",text:"Write narratives to develop real or imagined experiences or events using effective technique, well-chosen details, and well-structured event sequences. a. Engage and orient the reader by setting out a problem, situation, or observation, establishing one or multiple point(s) of view, and introducing a narrator and/or characters; create a smooth progression of experiences or events. b. Use narrative techniques, such as dialogue, pacing, description, reflection, and multiple plot lines, to develop experiences, events, and/or characters. c. Use a variety of techniques to sequence events so that they build on one another to create a coherent whole. d. Use precise words and phrases, telling details, and sensory language to convey a vivid picture of the experiences, events, setting, and/or characters. e. Provide a conclusion that follows from and reflects on what is experienced, observed, or resolved over the course of the narrative.",tags:["narrative-writing","writing-organization","precise-language"],subStrand:"Text Types and Purposes"},{id:"MI-W-9-10-4",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.4",text:"Produce clear and coherent writing in which the development, organization, and style are appropriate to task, purpose, and audience. (Grade-specific expectations for writing types are defined in standards 1\u20133 above.)",tags:["range-of-writing","writing-organization"],subStrand:"Production and Distribution of Writing"},{id:"MI-W-9-10-5",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.5",text:"Develop and strengthen writing as needed by planning, revising, editing, rewriting, or trying a new approach, focusing on addressing what is most significant for a specific purpose and audience. (Editing for conventions should demonstrate command of Language standards 1\u20133 up to and including grades 9\u201310.)",tags:["writing-process"],subStrand:"Production and Distribution of Writing"},{id:"MI-W-9-10-6",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.6",text:"Use technology, including the Internet, to produce, publish, and update individual or shared writing products, taking advantage of technology's capacity to link to other information and to display information flexibly and dynamically.",tags:["handwriting-keyboarding","digital-media-use"],subStrand:"Production and Distribution of Writing"},{id:"MI-W-9-10-7",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.7",text:"Conduct short as well as more sustained research projects to answer a question (including a self-generated question) or solve a problem; narrow or broaden the inquiry when appropriate; synthesize multiple sources on the subject, demonstrating understanding of the subject under investigation.",tags:["inquiry-process","integrating-sources"],subStrand:"Research to Build and Present Knowledge"},{id:"MI-W-9-10-8",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.8",text:"Gather relevant information from multiple authoritative print and digital sources, using advanced searches effectively; assess the usefulness of each source in answering the research question; integrate information into the text selectively to maintain the flow of ideas, avoiding plagiarism and following a standard format for citation.",tags:["source-evaluation","integrating-sources","citation-format"],subStrand:"Research to Build and Present Knowledge"},{id:"MI-W-9-10-9",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.9",text:"Draw evidence from literary or informational texts to support analysis, reflection, and research. a. Apply grades 9\u201310 Reading standards to literature (e.g., \u201CAnalyze how an author draws on and transforms source material in a specific work\u201D). b. Apply grades 9\u201310 Reading standards to literary nonfiction (e.g., \u201CDelineate and evaluate the argument and specific claims in a text, assessing whether the reasoning is valid and the evidence is relevant and sufficient; identify false statements and fallacious reasoning\u201D).",tags:["textual-evidence","lit-evidence-understanding","nonfiction-evidence-understanding"],subStrand:"Research to Build and Present Knowledge"},{id:"MI-W-9-10-10",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"W.9-10.10",text:"Write routinely over extended time frames (time for research, reflection, and revision) and shorter time frames (a single sitting or a day or two) for a range of tasks, purposes, and audiences.",tags:["range-of-writing","independent-reading"],subStrand:"Range of Writing"},{id:"MI-W-11-12-1",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.1",text:"Write arguments to support claims in an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence. a. Introduce precise, knowledgeable claim(s), establish the significance of the claim(s), distinguish the claim(s) from alternate or opposing claims, and create an organization that logically sequences claim(s), counterclaims, reasons, and evidence. b. Develop claim(s) and counterclaims fairly and thoroughly, supplying the most relevant evidence for each while pointing out the strengths and limitations of both in a manner that anticipates the audience's knowledge level, concerns, values, and possible biases. c. Use words, phrases, and clauses as well as varied syntax to link the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, between reasons and evidence, and between claim(s) and counterclaims. d. Establish and maintain a formal style and objective tone while attending to the norms and conventions of the discipline in which they are writing. e. Provide a concluding statement or section that follows from and supports the argument presented.",tags:["argument-writing","writing-organization","formal-english"],subStrand:"Text Types and Purposes"},{id:"MI-W-11-12-2",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.2",text:"Write informative/explanatory texts to examine and convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and analysis of content. a. Introduce a topic; organize complex ideas, concepts, and information so that each new element builds on that which precedes it to create a unified whole; include formatting (e.g., headings), graphics (e.g., figures, tables), and multimedia when useful to aiding comprehension. b. Develop the topic thoroughly by selecting the most significant and relevant facts, extended definitions, concrete details, quotations, or other information and examples appropriate to the audience's knowledge of the topic. c. Use appropriate and varied transitions and syntax to link the major sections of the text, create cohesion, and clarify the relationships among complex ideas and concepts. d. Use precise language, domain-specific vocabulary, and techniques such as metaphor, simile, and analogy to manage the complexity of the topic. e. Establish and maintain a formal style and objective tone while attending to the norms and conventions of the discipline in which they are writing. f. Provide a concluding statement or section that follows from and supports the information or explanation presented (e.g., articulating implications or the significance of the topic).",tags:["informational-writing","writing-organization","formal-english","precise-language","academic-vocabulary"],subStrand:"Text Types and Purposes"},{id:"MI-W-11-12-3",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.3",text:"Write narratives to develop real or imagined experiences or events using effective technique, well-chosen details, and well-structured event sequences. a. Engage and orient the reader by setting out a problem, situation, or observation and its significance, establishing one or multiple point(s) of view, and introducing a narrator and/or characters; create a smooth progression of experiences or events. b. Use narrative techniques, such as dialogue, pacing, description, reflection, and multiple plot lines, to develop experiences, events, and/or characters. c. Use a variety of techniques to sequence events so that they build on one another to create a coherent whole and build toward a particular tone and outcome (e.g., a sense of mystery, suspense, growth, or resolution). d. Use precise words and phrases, telling details, and sensory language to convey a vivid picture of the experiences, events, setting, and/or characters. e. Provide a conclusion that follows from and reflects on what is experienced, observed, or resolved over the course of the narrative.",tags:["narrative-writing","writing-organization","precise-language"],subStrand:"Text Types and Purposes"},{id:"MI-W-11-12-4",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.4",text:"Produce clear and coherent writing in which the development, organization, and style are appropriate to task, purpose, and audience. (Grade-specific expectations for writing types are defined in standards 1\u20133 above.)",tags:["range-of-writing","writing-organization"],subStrand:"Production and Distribution of Writing"},{id:"MI-W-11-12-5",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.5",text:"Develop and strengthen writing as needed by planning, revising, editing, rewriting, or trying a new approach, focusing on addressing what is most significant for a specific purpose and audience. (Editing for conventions should demonstrate command of Language standards 1\u20133 up to and including grades 11\u201312.)",tags:["writing-process"],subStrand:"Production and Distribution of Writing"},{id:"MI-W-11-12-6",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.6",text:"Use technology, including the Internet, to produce, publish, and update individual or shared writing products in response to ongoing feedback, including new arguments or information.",tags:["handwriting-keyboarding","digital-media-use"],subStrand:"Production and Distribution of Writing"},{id:"MI-W-11-12-7",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.7",text:"Conduct short as well as more sustained research projects to answer a question (including a self-generated question) or solve a problem; narrow or broaden the inquiry when appropriate; synthesize multiple sources on the subject, demonstrating understanding of the subject under investigation.",tags:["inquiry-process","integrating-sources"],subStrand:"Research to Build and Present Knowledge"},{id:"MI-W-11-12-8",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.8",text:"Gather relevant information from multiple authoritative print and digital sources, using advanced searches effectively; assess the strengths and limitations of each source in terms of the task, purpose, and audience; integrate information into the text selectively to maintain the flow of ideas, avoiding plagiarism and overreliance on any one source and following a standard format for citation.",tags:["source-evaluation","integrating-sources","citation-format"],subStrand:"Research to Build and Present Knowledge"},{id:"MI-W-11-12-9",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.9",text:"Draw evidence from literary or informational texts to support analysis, reflection, and research. a. Apply grades 11\u201312 Reading standards to literature (e.g., \u201CDemonstrate knowledge of eighteenth-, nineteenth- and early-twentieth-century foundational works of American literature, including how two or more texts from the same period treat similar themes or topics\u201D). b. Apply grades 11\u201312 Reading standards to literary nonfiction (e.g., \u201CDelineate and evaluate the reasoning in seminal U.S. texts, including the application of constitutional principles and use of legal reasoning and the premises, purposes, and arguments in works of public advocacy\u201D).",tags:["textual-evidence","lit-evidence-understanding","nonfiction-evidence-understanding"],subStrand:"Research to Build and Present Knowledge"},{id:"MI-W-11-12-10",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"W.11-12.10",text:"Write routinely over extended time frames (time for research, reflection, and revision) and shorter time frames (a single sitting or a day or two) for a range of tasks, purposes, and audiences.",tags:["range-of-writing","independent-reading"],subStrand:"Range of Writing"},{id:"MI-SL-9-10-1",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Speaking and Listening",code:"SL.9-10.1",text:"Initiate and participate effectively in a range of collaborative discussions (one-on-one, in groups, and teacher-led) with diverse partners on grades 9\u201310 topics, texts, and issues, building on others' ideas and expressing their own clearly and persuasively. a. Come to discussions prepared, having read and researched material under study; explicitly draw on that preparation by referring to evidence from texts and other research on the topic or issue to stimulate a thoughtful, well-reasoned exchange of ideas. b. Work with peers to set rules for collegial discussions and decision-making (e.g., informal consensus, taking votes on key issues, presentation of alternate views), clear goals and deadlines, and individual roles as needed. c. Propel conversations by posing and responding to questions that relate the current discussion to broader themes or larger ideas; actively incorporate others into the discussion; and clarify, verify, or challenge ideas and conclusions. d. Respond thoughtfully to diverse perspectives, summarize points of agreement and disagreement, and, when warranted, qualify or justify their own views and understanding and make new connections in light of the evidence and reasoning presented.",tags:["collaborative-discussion","speaking-listening"],subStrand:"Comprehension and Collaboration"},{id:"MI-SL-9-10-2",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Speaking and Listening",code:"SL.9-10.2",text:"Integrate multiple sources of information presented in diverse media or formats (e.g., visually, quantitatively, orally) evaluating the credibility and accuracy of each source.",tags:["integrating-sources","source-evaluation","multimodal-literacies"],subStrand:"Comprehension and Collaboration"},{id:"MI-SL-9-10-3",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Speaking and Listening",code:"SL.9-10.3",text:"Evaluate a speaker's point of view, reasoning, and use of evidence and rhetoric, identifying any fallacious reasoning or exaggerated or distorted evidence.",tags:["evaluating-speakers"],subStrand:"Comprehension and Collaboration"},{id:"MI-SL-9-10-4",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Speaking and Listening",code:"SL.9-10.4",text:"Present information, findings, and supporting evidence clearly, concisely, and logically such that listeners can follow the line of reasoning and the organization, development, substance, and style are appropriate to purpose, audience, and task.",tags:["oral-presentation","speaking-listening"],subStrand:"Presentation of Knowledge and Ideas"},{id:"MI-SL-9-10-5",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Speaking and Listening",code:"SL.9-10.5",text:"Make strategic use of digital media (e.g., textual, graphical, audio, visual, and interactive elements) in presentations to enhance understanding of findings, reasoning, and evidence and to add interest.",tags:["digital-media-use","multimodal-literacies"],subStrand:"Presentation of Knowledge and Ideas"},{id:"MI-SL-9-10-6",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Speaking and Listening",code:"SL.9-10.6",text:"Adapt speech to a variety of contexts and tasks, demonstrating command of formal English when indicated or appropriate. (See grades 9\u201310 Language standards 1 and 3 for specific expectations.)",tags:["formal-english","speaking-listening"],subStrand:"Presentation of Knowledge and Ideas"},{id:"MI-SL-11-12-1",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Speaking and Listening",code:"SL.11-12.1",text:"Initiate and participate effectively in a range of collaborative discussions (one-on-one, in groups, and teacher-led) with diverse partners on grades 11\u201312 topics, texts, and issues, building on others' ideas and expressing their own clearly and persuasively. a. Come to discussions prepared, having read and researched material under study; explicitly draw on that preparation by referring to evidence from texts and other research on the topic or issue to stimulate a thoughtful, well-reasoned exchange of ideas. b. Work with peers to promote civil, democratic discussions and decision-making, set clear goals and deadlines, and establish individual roles as needed. c. Propel conversations by posing and responding to questions that probe reasoning and evidence; ensure a hearing for a full range of positions on a topic or issue; clarify, verify, or challenge ideas and conclusions; and promote divergent and creative perspectives. d. Respond thoughtfully to diverse perspectives; synthesize comments, claims, and evidence made on all sides of an issue; resolve contradictions when possible; and determine what additional information or research is required to deepen the investigation or complete the task.",tags:["collaborative-discussion","speaking-listening"],subStrand:"Comprehension and Collaboration"},{id:"MI-SL-11-12-2",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Speaking and Listening",code:"SL.11-12.2",text:"Integrate multiple sources of information presented in diverse formats and media (e.g., visually, quantitatively, orally) in order to make informed decisions and solve problems, evaluating the credibility and accuracy of each source and noting any discrepancies among the data.",tags:["integrating-sources","source-evaluation","multimodal-literacies"],subStrand:"Comprehension and Collaboration"},{id:"MI-SL-11-12-3",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Speaking and Listening",code:"SL.11-12.3",text:"Evaluate a speaker's point of view, reasoning, and use of evidence and rhetoric, assessing the stance, premises, links among ideas, word choice, points of emphasis, and tone used.",tags:["evaluating-speakers","rhetorical-analysis"],subStrand:"Comprehension and Collaboration"},{id:"MI-SL-11-12-4",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Speaking and Listening",code:"SL.11-12.4",text:"Present information, findings, and supporting evidence, conveying a clear and distinct perspective, such that listeners can follow the line of reasoning, alternative or opposing perspectives are addressed, and the organization, development, substance, and style are appropriate to purpose, audience, and a range of formal and informal tasks.",tags:["oral-presentation","speaking-listening"],subStrand:"Presentation of Knowledge and Ideas"},{id:"MI-SL-11-12-5",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Speaking and Listening",code:"SL.11-12.5",text:"Make strategic use of digital media (e.g., textual, graphical, audio, visual, and interactive elements) in presentations to enhance understanding of findings, reasoning, and evidence and to add interest.",tags:["digital-media-use","multimodal-literacies"],subStrand:"Presentation of Knowledge and Ideas"},{id:"MI-SL-11-12-6",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Speaking and Listening",code:"SL.11-12.6",text:"Adapt speech to a variety of contexts and tasks, demonstrating a command of formal English when indicated or appropriate. (See grades 11\u201312 Language standards 1 and 3 for specific expectations.)",tags:["formal-english","speaking-listening"],subStrand:"Presentation of Knowledge and Ideas"},{id:"MI-L-9-10-1",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"L.9-10.1",text:"Demonstrate command of the conventions of standard English grammar and usage when writing or speaking. a. Use parallel structure. b. Use various types of phrases (noun, verb, adjectival, adverbial, participial, prepositional, absolute) and clauses (independent, dependent; noun, relative, adverbial) to convey specific meanings and add variety and interest to writing or presentations.",tags:["sentence-structure"],subStrand:"Conventions of Standard English"},{id:"MI-L-9-10-2",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"L.9-10.2",text:"Demonstrate command of the conventions of standard English capitalization, punctuation, and spelling when writing. a. Use a semicolon (and perhaps a conjunctive adverb) to link two or more closely related independent clauses. b. Use a colon to introduce a list or quotation. c. Spell correctly.",tags:["punctuation","spelling"],subStrand:"Conventions of Standard English"},{id:"MI-L-9-10-3",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"L.9-10.3",text:"Apply knowledge of language to understand how language functions in different contexts, to make effective choices for meaning or style, and to comprehend more fully when reading or listening. a. Write and edit work so that it conforms to the guidelines in a style manual (e.g., MLA Handbook, Turabian's Manual for Writers) appropriate for the discipline and writing type.",tags:["style-manual"],subStrand:"Knowledge of Language"},{id:"MI-L-9-10-4",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"L.9-10.4",text:"Determine or clarify the meaning of unknown and multiple-meaning words and phrases based on grades 9\u201310 reading and content, choosing flexibly from a range of strategies. a. Use context (e.g., the overall meaning of a sentence, paragraph, or text; a word's position or function in a sentence) as a clue to the meaning of a word or phrase. b. Identify and correctly use patterns of word changes that indicate different meanings or parts of speech (e.g., analyze, analysis, analytical; advocate, advocacy). c. Consult general and specialized reference materials (e.g., dictionaries, glossaries, thesauruses), both print and digital, to find the pronunciation of a word or determine or clarify its precise meaning, its part of speech, or its etymology. d. Verify the preliminary determination of the meaning of a word or phrase (e.g., by checking the inferred meaning in context or in a dictionary).",tags:["context-clues","word-patterns","reference-materials","word-meaning-verification"],subStrand:"Vocabulary Acquisition and Use"},{id:"MI-L-9-10-5",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"L.9-10.5",text:"Demonstrate understanding of figurative language, word relationships, and nuances in word meanings. a. Interpret figures of speech (e.g., euphemism, oxymoron) in context and analyze their role in the text. b. Analyze nuances in the meaning of words with similar denotations.",tags:["figurative-language","word-nuance"],subStrand:"Vocabulary Acquisition and Use"},{id:"MI-L-9-10-6",state:"Michigan",stateAbbr:"MI",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"L.9-10.6",text:"Acquire and use accurately general academic and domain-specific words and phrases, sufficient for reading, writing, speaking, and listening at the college and career readiness level; demonstrate independence in gathering vocabulary knowledge when considering a word or phrase important to comprehension or expression.",tags:["academic-vocabulary"],subStrand:"Vocabulary Acquisition and Use"},{id:"MI-L-11-12-1",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"L.11-12.1",text:"Demonstrate command of the conventions of standard English grammar and usage when writing or speaking. a. Apply the understanding that usage is a matter of convention, can change over time, and is sometimes contested. b. Resolve issues of complex or contested usage, consulting references (e.g., Merriam-Webster's Dictionary of English Usage, Garner's Modern American Usage) as needed.",tags:["usage-conventions","reference-materials"],subStrand:"Conventions of Standard English"},{id:"MI-L-11-12-2",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"L.11-12.2",text:"Demonstrate command of the conventions of standard English capitalization, punctuation, and spelling when writing. a. Observe hyphenation conventions. b. Spell correctly.",tags:["punctuation","spelling"],subStrand:"Conventions of Standard English"},{id:"MI-L-11-12-3",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"L.11-12.3",text:"Apply knowledge of language to understand how language functions in different contexts, to make effective choices for meaning or style, and to comprehend more fully when reading or listening. a. Vary syntax for effect, consulting references (e.g., Tufte's Artful Sentences) for guidance as needed; apply an understanding of syntax to the study of complex texts when reading.",tags:["sentence-structure","reference-materials"],subStrand:"Knowledge of Language"},{id:"MI-L-11-12-4",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"L.11-12.4",text:"Determine or clarify the meaning of unknown and multiple-meaning words and phrases based on grades 11\u201312 reading and content, choosing flexibly from a range of strategies. a. Use context (e.g., the overall meaning of a sentence, paragraph, or text; a word's position or function in a sentence) as a clue to the meaning of a word or phrase. b. Identify and correctly use patterns of word changes that indicate different meanings or parts of speech (e.g., conceive, conception, conceivable). c. Consult general and specialized reference materials (e.g., dictionaries, glossaries, thesauruses), both print and digital, to find the pronunciation of a word or determine or clarify its precise meaning, its part of speech, its etymology, or its standard usage. d. Verify the preliminary determination of the meaning of a word or phrase (e.g., by checking the inferred meaning in context or in a dictionary).",tags:["context-clues","word-patterns","reference-materials","word-meaning-verification","usage-conventions"],subStrand:"Vocabulary Acquisition and Use"},{id:"MI-L-11-12-5",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"L.11-12.5",text:"Demonstrate understanding of figurative language, word relationships, and nuances in word meanings. a. Interpret figures of speech (e.g., hyperbole, paradox) in context and analyze their role in the text. b. Analyze nuances in the meaning of words with similar denotations.",tags:["figurative-language","word-nuance"],subStrand:"Vocabulary Acquisition and Use"},{id:"MI-L-11-12-6",state:"Michigan",stateAbbr:"MI",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"L.11-12.6",text:"Acquire and use accurately general academic and domain-specific words and phrases, sufficient for reading, writing, speaking, and listening at the college and career readiness level; demonstrate independence in gathering vocabulary knowledge when considering a word or phrase important to comprehension or expression.",tags:["academic-vocabulary"],subStrand:"Vocabulary Acquisition and Use"},{id:"NC-9-10-CT-1-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Complex Texts",code:"9-10.CT.1.1",text:"Cite the most relevant textual evidence to support analysis of what a text says as well as inferences drawn from a text.",tags:["textual-evidence"],subStrand:"9-10.CT.1 Independently read and listen to texts at the high end of the 9-10 text complexity band, applying skills from the grades 9-10 standards proficiently."},{id:"NC-9-10-CT-1-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Complex Texts",code:"9-10.CT.1.2",text:"Use self-monitoring, repeated reading, objective summarizing, writing in response to texts, and discussions with peers and adults to strengthen comprehension.",tags:["reading-fluency","collaborative-discussion"],subStrand:"9-10.CT.1 Independently read and listen to texts at the high end of the 9-10 text complexity band, applying skills from the grades 9-10 standards proficiently."},{id:"NC-9-10-CT-1-3",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Complex Texts",code:"9-10.CT.1.3",text:"Draw on a wide reading of texts, including texts on the Holocaust and genocide, to build knowledge and vocabulary.",tags:["volume-of-reading","mandated-topic","academic-vocabulary"],subStrand:"9-10.CT.1 Independently read and listen to texts at the high end of the 9-10 text complexity band, applying skills from the grades 9-10 standards proficiently."},{id:"NC-9-10-CT-1-4",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Complex Texts",code:"9-10.CT.1.4",text:"Recognize the choices and features used by authors and transfer those techniques to communication and writing.",tags:["authorial-intent","range-of-writing"],subStrand:"9-10.CT.1 Independently read and listen to texts at the high end of the 9-10 text complexity band, applying skills from the grades 9-10 standards proficiently."},{id:"NC-9-10-CD-F-3-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development / Foundational Skills",code:"9-10.CD.F.3.1",text:"Apply knowledge of syllabication to support word recognition.",tags:["decoding"],subStrand:"9-10.CD.F.3 Apply K-10 word recognition and word knowledge skills to comprehend texts at the high end of the 9-10 text complexity band."},{id:"NC-9-10-CD-F-3-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development / Foundational Skills",code:"9-10.CD.F.3.2",text:"Apply knowledge of morphology to support word knowledge.",tags:["decoding","word-patterns"],subStrand:"9-10.CD.F.3 Apply K-10 word recognition and word knowledge skills to comprehend texts at the high end of the 9-10 text complexity band."},{id:"NC-9-10-CD-F-4-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development / Foundational Skills",code:"9-10.CD.F.4.1",text:"Read texts for a variety of purposes.",tags:["reading-fluency"],subStrand:"9-10.CD.F.4 Orally read texts with fluency to support comprehension."},{id:"NC-9-10-CD-F-4-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development / Foundational Skills",code:"9-10.CD.F.4.2",text:"Confirm or self-correct word recognition and understanding, as necessary.",tags:["reading-fluency","word-meaning-verification"],subStrand:"9-10.CD.F.4 Orally read texts with fluency to support comprehension."},{id:"NC-9-10-CD-F-4-3",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development / Foundational Skills",code:"9-10.CD.F.4.3",text:"Read texts with accuracy, appropriate rate, and prosody on successive readings.",tags:["reading-fluency"],subStrand:"9-10.CD.F.4 Orally read texts with fluency to support comprehension."},{id:"NC-9-10-CD- ts"],subStrand:"9-10.CD.3 Analyze how multiple texts of historical or literary influence use particular approaches to examine similar themes and main ideas."},{id:"NC-9-10-CD-3-4",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development",code:"9-10.CD.3.4",text:"Evaluate the credibility and accuracy of an author's interpretations of source material or information.",tags:["source-evaluation","evaluating-explanations"],subStrand:"9-10.CD.3 Analyze how multiple texts of historical or literary influence use particular approaches to examine similar themes and main ideas."},{id:"NC-9-10-CD-4-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development",code:"9-10.CD.4.1",text:"Determine or clarify the meaning of grade-appropriate general academic and domain-specific words and phrases in texts.",tags:["academic-vocabulary","context-clues"],subStrand:"9-10.CD.4 Apply knowledge of how K-10 language functions in different contexts, when writing, speaking, reading, and listening."},{id:"NC-9-10-CD-4-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development",code:"9-10.CD.4.2",text:"Recognize, interpret, and use figurative language, as well as rhetorical and literary elements.",tags:["figurative-language","rhetorical-analysis"],subStrand:"9-10.CD.4 Apply knowledge of how K-10 language functions in different contexts, when writing, speaking, reading, and listening."},{id:"NC-9-10-CD-4-3",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development",code:"9-10.CD.4.3",text:"Differentiate between contexts, audiences, and purposes that call for formal and informal English.",tags:["formal-english"],subStrand:"9-10.CD.4 Apply knowledge of how K-10 language functions in different contexts, when writing, speaking, reading, and listening."},{id:"NC-9-10-CD-4-5",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Comprehension Development",code:"9-10.CD.4.5",text:"Interpret the syntax of phrases, clauses, and sentences to comprehend texts at the high end of the 9-10 text complexity band.",tags:["sentence-structure","text-complexity"],subStrand:"9-10.CD.4 Apply knowledge of how K-10 language functions in different contexts, when writing, speaking, reading, and listening."},{id:"NC-9-10-CW-1-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.1.1",text:"Work with peers to set norms or expectations for civil, collegial discussions and decision-making, establishing individual roles as needed.",tags:["collaborative-discussion","speaking-listening"],subStrand:"9-10.CW.1 Initiate and propel collaborative discussions about texts, building on others' perspectives and expressing their own in a compelling manner."},{id:"NC-9-10-CW-1-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.1.2",text:"Refer to evidence from texts and other research on the topic or issue to clarify, verify, or challenge ideas and conclusions.",tags:["collaborative-discussion","textual-evidence"],subStrand:"9-10.CW.1 Initiate and propel collaborative discussions about texts, building on others' perspectives and expressing their own in a compelling manner."},{id:"NC-9-10-CW-1-3",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.1.3",text:"Pose and respond to questions that relate the current discussion to broader themes, larger ideas, prior knowledge, and real-world contexts.",tags:["collaborative-discussion"],subStrand:"9-10.CW.1 Initiate and propel collaborative discussions about texts, building on others' perspectives and expressing their own in a compelling manner."},{id:"NC-9-10-CW-1-4",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],s "},{id:"NC-9-10-CW-5-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.5.1",text:"Narrow or broaden the scope of inquiry when appropriate to answer a question, using advanced searches effectively.",tags:["inquiry-process"],subStrand:"9-10.CW.5 Construct thorough research projects to answer a question related to a topic, concept, or theme aligned to grades 9-10 content."},{id:"NC-9-10-CW-5-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.5.2",text:"Synthesize relevant information from multiple authoritative sources to maintain a clear line of reasoning.",tags:["integrating-sources"],subStrand:"9-10.CW.5 Construct thorough research projects to answer a question related to a topic, concept, or theme aligned to grades 9-10 content."},{id:"NC-9-10-CW-5-3",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.5.3",text:"Evaluate the relevance, credibility, accuracy, and authoritativeness of each source.",tags:["source-evaluation"],subStrand:"9-10.CW.5 Construct thorough research projects to answer a question related to a topic, concept, or theme aligned to grades 9-10 content."},{id:"NC-9-10-CW-5-4",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.5.4",text:"Conform to the guidelines in a style manual appropriate for the discipline and source type to avoid plagiarism.",tags:["style-manual","citation-format"],subStrand:"9-10.CW.5 Construct thorough research projects to answer a question related to a topic, concept, or theme aligned to grades 9-10 content."},{id:"NC-9-10-CW-6-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.6.1",text:"Plan written and spoken products by organizing information and ideas around a topic.",tags:["writing-process","writing-organization"],subStrand:"9-10.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-9-10-CW-6-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.6.2",text:"Draft written and spoken products to address what is most significant for a specific purpose, anticipating the knowledge level and concerns of the audience.",tags:["writing-process","range-of-writing"],subStrand:"9-10.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-9-10-CW-6-3",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.6.3",text:"Revise, edit, and rewrite written and spoken products, using support and collaboration with peers and adults.",tags:["writing-process"],subStrand:"9-10.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-9-10-CW-6-4",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.6.4",text:"Publish, present, and produce written and spoken products, making strategic use of digital tools and multimodalities to enhance understanding and add interest.",tags:["digital-media-use","multimodal-literacies","oral-presentation"],subStrand:"9-10.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-9-10-CW-7-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.7.1",text:"Introduce and contextualize precise claim(s) and distinguish the claim(s) from alternate or opposing claims.",tags:["argument-writing"],subStrand:"9-10.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-9-10-CW-7-2",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.7.2",text:"Develop claim(s) and counterclaims fairly, using the most relevant evidence and rhetorical techniques.",tags:["argument-writing","rhetorical-analysis"],subStrand:"9-10.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-9-10-CW-7-3",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.7.3",text:"Connect the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, reasons and evidence, and claim(s) and counterclaims, using words, phrases, and clauses.",tags:["argument-writing","writing-organization"],subStrand:"9-10.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-9-10-CW-7-4",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.7.4",text:"Provide a concluding section that supports or emphasizes the argument presented, including conveying the urgency of the argument or a call to action, where appropriate.",tags:["argument-writing","writing-organization"],subStrand:"9-10.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-9-10-CW-8-1",state:"North Carolina",stateAbbr:"NC",grade:"9-10",gradesCovered:[9,10],strand:"Communication & Writing",code:"9-10.CW.8.1",text:"Introduce the topic and focus clearly, and strategically structure complex ideas, concepts, and information.",tags:["informational-writing","writing-organization"],subStrand:"9-10.CW.8 Construct spoken and written analytical expository texts to convey complex xt:"Recognize the choices and features used by authors and transfer those techniques to communication and writing.",tags:["authorial-intent","range-of-writing"],subStrand:"11-12.CT.1 Independently read and listen to texts at the high end of the 11-12 text complexity band, applying skills from the grades 11-12 standards proficiently."},{id:"NC-11-12-CD-F-3-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development / Foundational Skills",code:"11-12.CD.F.3.1",text:"Apply knowledge of syllabication to support word recognition.",tags:["decoding"],subStrand:"11-12.CD.F.3 Apply K-12 word recognition and word knowledge skills to comprehend texts at the high end of the 11-12 text complexity band."},{id:"NC-11-12-CD-F-3-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development / Foundational Skills",code:"11-12.CD.F.3.2",text:"Apply knowledge of morphology to support word knowledge.",tags:["decoding","word-patterns"],subStrand:"11-12.CD.F.3 Apply K-12 word recognition and word knowledge skills to comprehend texts at the high end of the 11-12 text complexity band."},{id:"NC-11-12-CD-F-4-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development / Foundational Skills",code:"11-12.CD.F.4.1",text:"Read texts for a variety of purposes.",tags:["reading-fluency"],subStrand:"11-12.CD.F.4 Orally read texts with fluency to support comprehension."},{id:"NC-11-12-CD-F-4-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development / Foundational Skills",code:"11-12.CD.F.4.2",text:"Confirm or self-correct word recognition and understanding, as necessary.",tags:["reading-fluency","word-meaning-verification"],subStrand:"11-12.CD.F.4 Orally read texts with fluency to support comprehension."},{id:"NC-11-12-CD-F-4-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development / Foundational Skills",code:"11-12.CD.F.4.3",text:"Read texts with accuracy, appropriate rate, and prosody on successive readings.",tags:["reading-fluency"],subStrand:"11-12.CD.F.4 Orally read texts with fluency to support comprehension."},{id:"NC-11-12-CD-1-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.1.1",text:"Determine the themes or main ideas in a text.",tags:["theme-development","central-idea"],subStrand:"11-12.CD.1 Evaluate the development of multiple themes and main ideas, articulating the relationships between them in texts."},{id:"NC-11-12-CD-1-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.1.2",text:"Analyze the development of--and hierarchical, competing, or complementary relationships between--complex literary or rhetorical elements and how they contribute to the themes or main ideas in a text.",tags:["theme-development","central-idea","analysis-of-ideas"],subStrand:"11-12.CD.1 Evaluate the development of multiple themes and main ideas, articulating the relationships between them in texts."},{id:"NC-11-12-CD-2-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.2.1",text:"Determine how real-world context(s), events, and circumstances prompted or informed the creation of a text and contributed to its purpose and perspective, including possible bias.",tags:["authorial-intent","point-of-view"],subStrand:"11-12.CD.2 Evaluate the effectiveness of an author's style and content in establishing and advancing their purpose and perspective."},{id:"NC-11-12-CD-2-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.2.2",text:"Analyze how syntactical and organizational structures affect the clarity, power, and persuasiveness of paring-texts","multiple-interpretations"],subStrand:"11-12.CD.3 Evaluate how multiple texts of historical or literary influence use particular approaches to examine similar themes and main ideas."},{id:"NC-11-12-CD-3-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.3.3",text:"Analyze how changes in societal perspectives or attitudes affect how authors represent historical or literary source material in texts.",tags:["point-of-view","seminal-documents"],subStrand:"11-12.CD.3 Evaluate how multiple texts of historical or literary influence use particular approaches to examine similar themes and main ideas."},{id:"NC-11-12-CD-3-4",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.3.4",text:"Evaluate the credibility and accuracy of an author's interpretations of source material or information.",tags:["source-evaluation","evaluating-explanations"],subStrand:"11-12.CD.3 Evaluate how multiple texts of historical or literary influence use particular approaches to examine similar themes and main ideas."},{id:"NC-11-12-CD-4-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.4.1",text:"Determine or clarify the meaning of grade-appropriate general academic and domain-specific words and phrases in texts.",tags:["academic-vocabulary","context-clues"],subStrand:"11-12.CD.4 Apply knowledge of how K-12 language functions in different contexts, when writing, speaking, reading, and listening."},{id:"NC-11-12-CD-4-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Comprehension Development",code:"11-12.CD.4.2",text:"Recognize, interpret, and use figurative language, as well as rhetorical and literary elements.",tags:["figurative-language","rhetorical-analysis"],subStrand:"11-12.CD.4 Apply knowledge of how K-12 language functions rolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.1.3",text:"Probe reasoning and evidence to promote divergent and creative perspectives regarding broader themes, larger ideas, prior knowledge, and real-world contexts.",tags:["collaborative-discussion","evaluating-speakers"],subStrand:"11-12.CW.1 Initiate and propel collaborative discussions about texts, building on others' perspectives and expressing their own in a compelling manner."},{id:"NC-11-12-CW-1-4",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.1.4",text:"Synthesize comments, claims, and evidence made on all sides of an issue to resolve contradictions in pursuit of consensus.",tags:["collaborative-discussion","integrating-sources"],subStrand:"11-12.CW.1 Initiate and propel collaborative discussions about texts, building on others' perspectives and expressing their own in a compelling manner."},{id:"NC-11-12-CW-2-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.2.1",text:"Use verbals and verbal phrases to increase variety, precision, and nuance based on their function.",tags:["sentence-structure","precise-language"],subStrand:"11-12.CW.2 Demonstrate strategic command of grades K-12 grammar and usage when writing or speaking to create a unique style and voice."},{id:"NC-11-12-CW-2-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.2.2",text:"Use verb tenses and aspects to convey conditional and subjunctive moods in order to suggest possibilities or express hypothetical situations.",tags:["voice-and-mood"],subStrand:"11-12.CW.2 Demonstrate strategic command of grades K-12 grammar and usage when writing or speaking to create a unique style and voice."},{id:"NC-11-12-CW-2-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.2.3",text:"Use parallel structure to emphasize parity between ideas.",tags:["sentence-structure"],subStrand:"11-12.CW.2 Demonstrate strategic command of grades K-12 grammar and usage when writing or speaking to create a unique style and voice."},{id:"NC-11-12-CW-3-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.3.1",text:"Use em dashes for nonrestrictive/parenthetical elements.",tags:["punctuation"],subStrand:"11-12.CW.3 Demonstrate strategic command of grades K-12 conventions when writing to create a unique style and voice."},{id:"NC-11-12-CW-3-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.3.2",text:"Use a semicolon with conjunctive adverbs or transitional phrases to link independent clauses, as well as with coordinating conjunctions when independent clauses contain internal punctuation.",tags:["punctuation"],subStrand:"11-12.CW.3 Demonstrate strategic command of grades K-12 conventions when writing to create a unique style and voice."},{id:"NC-11-12-CW-3-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.3.3",text:"Apply conventions for formatting block quotes.",tags:["punctuation","style-manual"],subStrand:"11-12.CW.3 Demonstrate strategic command of grades K-12 conventions when writing to create a unique style and voice."},{id:"NC-11-12-CW-4-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.4.1",text:"Create texts that demonstrate command of transcription skills.",tags:["handwriting-keyboarding"],subStrand:"11-12.CW.4 Produce sentences appropriate for grades 11-12, with increasing fluency and complexity."},{id:"NC-11-12-CW-4-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.4.2",text:"Use a wide variety of sentence structures to achieve particular effects.",tags:["sentence-structure"],subStrand:"11-12.CW.4 Produce sentences appropriate for grades 11-12, with increasing fluency and complexity."},{id:"NC-11-12-CW-4-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.4.3",text:"Use non-standard sentence structures to achieve particular literary or rhetorical effects.",tags:["sentence-structure","rhetorical-analysis"],subStrand:"11-12.CW.4 Produce sentences appropriate for grades 11-12, with increasing fluency and complexity."},{id:"NC-11-12-CW-5-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.5.1",text:"Narrow or broaden the scope of inquiry when appropriate to answer a question, using advanced searches effectively.",tags:["inquiry-process"],subStrand:"11-12.CW.5 Construct thorough research projects to answer a question or to make informed decisions related to a topic, concept, or theme aligned to grades 11-12 content."},{id:"NC-11-12-CW-5-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.5.2",text:"Synthesize relevant information from multiple authoritative sources to maintain a clear line of reasoning.",tags:["integrating-sources"],subStrand:"11-12.CW.5 Construct thorough research projects to answer a question or to make informed decisions related to a topic, concept, or theme aligned to grades 11-12 content."},{id:"NC-11-12-CW-5-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.5.3",text:"Evaluate the validity and authoritativeness of each source.",tags:["source-evaluation"],subStrand:"11-12.CW.5 Construct thorough research projects to answer a question or to make informed decisions related to a topic, concept, or theme aligned to grades 11-12 content."},{id:"NC-11-12-CW-5-4",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.5.4",text:"Conform to the guidelines in a style manual appropriate for the discipline and source type, avoiding plagiarism and overreliance on any one source.",tags:["style-manual","citation-format"],subStrand:"11-12.CW.5 Construct thorough research projects to answer a question or to make informed decisions related to a topic, concept, or theme aligned to grades 11-12 content."},{id:"NC-11-12-CW-6-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.6.1",text:"Plan written and spoken products by organizing information and ideas around a topic.",tags:["writing-process","writing-organization"],subStrand:"11-12.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-11-12-CW-6-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.6.2",text:"Draft written and spoken products to address what is most significant for a specific purpose, anticipating the knowledge level, concerns, values, and possible biases of the audience.",tags:["writing-process","range-of-writing"],subStrand:"11-12.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-11-12-CW-6-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.6.3",text:"Revise, edit, and rewrite written and spoken products, using support and collaboration with peers and adults.",tags:["writing-process"],subStrand:"11-12.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-11-12-CW-6-4",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.6.4",text:"Publish, present, and produce wri
