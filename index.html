tten and spoken products, making strategic use of digital tools and multimodalities to enhance understanding and add interest.",tags:["digital-media-use","multimodal-literacies","oral-presentation"],subStrand:"11-12.CW.6 Use a recursive process to refine spoken and written products."},{id:"NC-11-12-CW-7-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.7.1",text:"Introduce and contextualize precise, knowledgeable claim(s), establish the relevance of the claim(s), and distinguish the claim(s) from alternate or opposing claims.",tags:["argument-writing"],subStrand:"11-12.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-11-12-CW-7-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.7.2",text:"Develop claim(s) and counterclaims fairly and thoroughly, using the most relevant evidence and rhetorical techniques.",tags:["argument-writing","rhetorical-analysis"],subStrand:"11-12.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-11-12-CW-7-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.7.3",text:"Connect the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, reasons and evidence, and claim(s) and counterclaims, using words, phrases, and clauses.",tags:["argument-writing","writing-organization"],subStrand:"11-12.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-11-12-CW-7-4",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.7.4",text:"Provide a concluding section that supports or emphasizes the argument presented, including conveying the urgency of the argument or a call to action, where appropriate.",tags:["argument-writing","writing-organization"],subStrand:"11-12.CW.7 Construct spoken and written persuasive texts to support claims derived from an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence."},{id:"NC-11-12-CW-8-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.8.1",text:"Introduce the topic and focus clearly, and strategically structure complex ideas, concepts, and information.",tags:["informational-writing","writing-organization"],subStrand:"11-12.CW.8 Construct spoken and written analytical expository texts to convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and examination of content."},{id:"NC-11-12-CW-8-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.8.2",text:"Develop the topic thoroughly by selecting the most significant and relevant facts, extended definitions, concrete details, quotations, and other information or examples related to the topic.",tags:["informational-writing"],subStrand:"11-12.CW.8 Construct spoken and written analytical expository texts to convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and examination of content."},{id:"NC-11-12-CW-8-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.8.3",text:"Create cohesion, link major sections of the text, and clarify the relationships between explanations of complex ideas and concepts, using varied transitions and domain-specific vocabulary.",tags:["informational-writing","writing-organization","academic-vocabulary"],subStrand:"11-12.CW.8 Construct spoken and written analytical expository texts to convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and examination of content."},{id:"NC-11-12-CW-8-4",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.8.4",text:"Provide a concluding section that follows and supports the information or explanation presented.",tags:["informational-writing","writing-organization"],subStrand:"11-12.CW.8 Construct spoken and written analytical expository texts to convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and examination of content."},{id:"NC-11-12-CW-9-1",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.9.1",text:"Engage and orient the audience by setting out a problem, situation, or observation and its significance, establishing one or multiple perspectives, and introducing literary elements.",tags:["narrative-writing","point-of-view"],subStrand:"11-12.CW.9 Construct spoken and written poetic, descriptive, and narrative texts to develop real or imagined experiences, events, or ideas that center around a consistent theme(s) using effective technique, well-chosen details, and well-structured sequences."},{id:"NC-11-12-CW-9-2",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.9.2",text:"Convey experiences and other literary elements that are complementary to the intended theme(s), using precise words and phrases, figurative language, rhetorical techniques, and telling and sensory details.",tags:["narrative-writing","figurative-language","precise-language"],subStrand:"11-12.CW.9 Construct spoken and written poetic, descriptive, and narrative texts to develop real or imagined experiences, events, or ideas that center around a consistent theme(s) using effective technique, well-chosen details, and well-structured sequences."},{id:"NC-11-12-CW-9-3",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.9.3",text:"Establish a sequence of well-developed topics, experiences, events, or characters to convey intended theme(s) using literary techniques.",tags:["narrative-writing","writing-organization"],subStrand:"11-12.CW.9 Construct spoken and written poetic, descriptive, and narrative texts to develop real or imagined experiences, events, or ideas that center around a consistent theme(s) using effective technique, well-chosen details, and well-structured sequences."},{id:"NC-11-12-CW-9-4",state:"North Carolina",stateAbbr:"NC",grade:"11-12",gradesCovered:[11,12],strand:"Communication & Writing",code:"11-12.CW.9.4",text:"Conclude the text in a manner that emphasizes the theme(s) developed over the course of the text.",tags:["narrative-writing","theme-development"],subStrand:"11-12.CW.9 Construct spoken and written poetic, descriptive, and narrative texts to develop real or imagined experiences, events, or ideas that center around a consistent theme(s) using effective technique, well-chosen details, and well-structured sequences."},{id:"SD-RL-9-10-1",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.1",text:"Cite strong, relevant and thorough textual evidence to support analysis of what the text says explicitly and inferentially.",tags:["textual-evidence"]},{id:"SD-RL-9-10-2",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.2",text:"Determine a theme or central idea of a text. a. Analyze its development over the course of the text, including how it is introduced, built, and refined by specific details. b. Provide an objective summary of the text to support thematic analysis.",tags:["theme-development"]},{id:"SD-RL-9-10-3",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.3",text:"Analyze how complex characters (e.g., those with multiple or conflicting motivations) and events develop over the course of a text, interact with others, and advance the plot or develop the theme.",tags:["character-development"]},{id:"SD-RL-9-10-4",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.4",text:"Analyze the impact of specific word choices and figurative language on meaning, mood, and tone (e.g., connotation, dialect, how the language evokes a sense of time and place; how it sets a formal or informal tone).",tags:["word-choice-impact","figurative-language"]},{id:"SD-RL-9-10-5",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.5",text:"Analyze how an author's choices concerning how to structure a text, order events within it, and manipulate time create such effects as mystery, tension, or surprise.",tags:["lit-text-structure"]},{id:"SD-RL-9-10-6",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.6",text:"Assess how point of view and/or author purpose shapes the content and style of culturally diverse texts, including those from outside the United States. Reflect on how personal experiences impact interpretations of a text.",tags:["point-of-view"]},{id:"SD-RL-9-10-7",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.7",text:"Analyze the representation of a subject or a key scene in two different artistic mediums, including what is emphasized or absent in each treatment.",tags:["multiple-interpretations","media-comparison"]},{id:"SD-RL-9-10-9",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.9",text:"Analyze a variety of related literary texts including how two or more texts from the same period treat similar themes or topics. Explain how an author draws upon or alludes to source material.",tags:["comparing-texts","allusion"]},{id:"SD-RL-9-10-10",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Literature",code:"9-10.RL.10",text:"By the end of the year, independently read and comprehend literary texts representing a variety of genres, cultures, and perspectives that exhibit complexity appropriate for at least grade 9 and 10. a. Demonstrate proficiency in reading and comprehending grade-appropriate texts. b. Self-select texts for personal enjoyment, interest, and academic tasks. c. Read widely to understand multiple perspectives and diverse viewpoints.",tags:["text-complexity","independent-reading","volume-of-reading"]},{id:"SD-RI-9-10-1",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.1",text:"Cite strong, relevant and thorough textual evidence to support analysis of what the text says explicitly and inferentially.",tags:["textual-evidence"]},{id:"SD-RI-9-10-2",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.2",text:"Determine a central idea of a text. a. Analyze its development over the course of the text, including how it is introduced, built, and refined by specific details. b. Provide an objective summary of the text to support analysis.",tags:["central-idea"]},{id:"SD-RI-9-10-3",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.3",text:"Analyze a text to explain how specific individuals, ideas, or events interact and develop over the course of the text, including explicit and implicit connections.",tags:["analysis-of-ideas"]},{id:"SD-RI-9-10-4",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.4",text:"Distinguish among figurative, connotative, and technical meanings. Analyze the cumulative impact of specific word choices on meaning and tone (e.g., how the language of a court opinion differs from that of a newspaper).",tags:["word-choice-impact","figurative-language","word-nuance"]},{id:"SD-RI-9-10-5",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.5",text:"Analyze in detail how an author's ideas or claims are developed and refined by particular text structures (e.g. sentences, paragraphs, or larger portions of a text).",tags:["nonfiction-text-structure"]},{id:"SD-RI-9-10-6",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.6",text:"Determine an author's point of view or purpose in a text. a. Analyze how an author uses rhetoric to advance that point of view or purpose. b. Evaluate a text for bias and/or fallacies.",tags:["point-of-view","rhetorical-analysis","argument-evaluation"]},{id:"SD-RI-9-10-7",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.7",text:"Analyze various accounts of a subject told in different mediums (e.g., a person's life story in both print and multimedia), determining which details are emphasized in each account.",tags:["media-comparison"]},{id:"SD-RI-9-10-8",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.8",text:"Delineate and evaluate the argument and specific claims in a text. a. Assess whether the reasoning is valid, and the evidence is relevant and sufficient. b. Identify false statements and fallacious reasoning.",tags:["argument-evaluation"]},{id:"SD-RI-9-10-9",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.9",text:"Analyze seminal U.S. documents of historical and literary significance, including how they address related themes and concepts. Compare the approaches of two or more authors.",tags:["seminal-documents","comparing-texts"]},{id:"SD-RI-9-10-10",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Reading Informational Text",code:"9-10.RI.10",text:"By the end of the year, independently read and comprehend literary nonfiction and informational texts representing a variety of genres, cultures, and perspectives that exhibit complexity appropriate for at least grade 9 and 10. a. Demonstrate proficiency in reading and comprehending grade-appropriate texts. b. Self-select texts for personal enjoyment, interest, and academic tasks. c. Read widely to understand diverse perspectives and viewpoints.",tags:["text-complexity","independent-reading","volume-of-reading"]},{id:"SD-L-9-10-1",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"9-10.L.1",text:"Demonstrate command of the conventions of standard English grammar and usage when writing or speaking. a. Use parallel structure. b. Use various types of phrases (noun, verb, adjectival, adverbial, participial, gerund, infinitive, prepositional, absolute) and clauses (independent, dependent; noun, relative, adverbial) to convey specific meanings, include a variety of sentence structures (syntax), and increase fluency in writing or presentations.",tags:["sentence-structure","usage-conventions"]},{id:"SD-L-9-10-2",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"9-10.L.2",text:"Demonstrate command of standard English mechanics and conventions; consult references as needed. a. Use a semicolon (and perhaps a conjunctive adverb) to link two or more closely related independent clauses and to link complex lists. b. Use colons correctly. c. Use hyphens, dashes, and other punctuation correctly. d. Use standard English spelling and capitalization.",tags:["punctuation","spelling","usage-conventions"]},{id:"SD-L-9-10-3",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"9-10.L.3",text:"Apply knowledge of language to understand how language functions in different contexts, to make effective choices for meaning or style, and to comprehend more fully when reading or listening. Write and edit work so that it conforms to the guidelines in a style manual (e.g., MLA Handbook, APA Handbook) appropriate for the discipline and writing type.",tags:["style-manual","formal-english"]},{id:"SD-L-9-10-4",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"9-10.L.4",text:"Determine or clarify the meaning of unknown and multiple-meaning words and phrases based on grades 9-10 reading and content, choosing flexibly from a range of strategies. a. Use context (e.g., the overall meaning of a sentence, paragraph, or text; a word's position or function in a sentence) to determine the meaning of a word or phrase. b. Use morphology to indicate different meanings or parts of speech (e.g., analyze, analysis, analytical; advocate, advocacy). c. Consult general and specialized reference materials (e.g., dictionaries, glossaries, thesauruses) to find the pronunciation of a word or determine or clarify its precise meaning, its part of speech, or its etymology.",tags:["context-clues","word-patterns","reference-materials"]},{id:"SD-L-9-10-5",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"9-10.L.5",text:"Demonstrate understanding of semantics. a. Interpret figurative language (e.g., euphemism, oxymoron) in context and analyze its role in the text. b. Analyze word relationships (morphology, etymology, and linguistics) and their role in creating nuanced meaning. c. Analyze connotative meanings of words with similar denotations.",tags:["figurative-language","word-patterns","word-nuance"]},{id:"SD-L-9-10-6",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Language",code:"9-10.L.6",text:"Acquire and accurately use general academic and domain-specific words and phrases sufficient for reading, writing, speaking, and listening at the college and career readiness level. a. Demonstrate independence in gathering a broad and precise vocabulary. b. Understand the importance of vocabulary knowledge in comprehension or expression.",tags:["academic-vocabulary"]},{id:"SD-W-9-10-1",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.1",text:"Write arguments to support claims in an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence. a. Introduce precise claim(s), distinguish the claim(s) from alternate or opposing claims, and create an organization that establishes clear relationships among claim(s), counterclaims, reasons, and evidence. b. Develop claim(s) and counterclaims fairly, supplying valid and sufficient evidence for each while pointing out the strengths and limitations of both in a manner that anticipates the audience's knowledge level and concerns. c. Use appropriate and varied transitional words, phrases, and clauses to link the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, between reasons and evidence, and between claim(s) and counterclaims. d. Establish and maintain a formal style and clear voice while attending to the norms and conventions of the discipline in which they are writing. e. Craft a concluding statement or section that follows from and supports the argument presented.",tags:["argument-writing","writing-organization","formal-english"]},{id:"SD-W-9-10-2",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.2",text:"Write informative/explanatory texts to examine and convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and analysis of content. a. Introduce a topic; organize complex ideas, concepts, and information to make important connections and distinctions; include formatting (e.g., headings), graphics (e.g., figures, tables), and multimedia when useful to aid comprehension. b. Develop the topic with well-chosen, relevant, and sufficient facts, extended definitions, concrete details, quotations, or other information and examples appropriate to the audience's knowledge of the topic. c. Use appropriate and varied transitional words, phrases, and clauses to link the major sections of the text, create cohesion, and clarify the relationships among complex ideas and concepts. d. Use precise language and domain-specific vocabulary to manage the complexity of the topic. e. Establish a clear voice. f. Provide a concluding statement or section that follows from and supports the information or explanation presented (e.g., articulating implications or the significance of the topic).",tags:["informational-writing","writing-organization","precise-language"]},{id:"SD-W-9-10-3",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.3",text:"Write narratives or other creative texts (e.g., poetry, digital composition, graphic stories, memoirs) to develop real or imagined experiences or events using effective technique and voice, well-chosen details, and well-structured event sequences. a. Engage and orient the reader by setting out a problem, situation, or observation, establishing one or multiple point(s) of view, and introducing a narrator and/or characters; create a smooth progression of experiences or events. b. Use narrative or literary techniques or poetic devices, such as dialogue, pacing, rhythm, description, reflection, and multiple plot lines, to develop experiences, events, and/or characters. c. Use a variety of techniques to sequence events so that they build on one another to create a coherent whole. d. Use strong, effective word choice and figurative language to convey a vivid picture of the experiences, events, setting, and/or characters. e. Establish a clear voice. f. Provide a conclusion (when appropriate to the genre) that follows from and reflects on what is experienced, observed, or resolved over the course of the narrative or creative text.",tags:["narrative-writing","writing-organization"]},{id:"SD-W-9-10-4",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.4",text:"Produce clear and coherent writing in which the development, organization, style, voice, and tone are appropriate to task, purpose, and audience. (Grade-band specific expectations for writing types are defined in standards 1-3 above.)",tags:["range-of-writing","writing-organization"]},{id:"SD-W-9-10-5",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.5",text:"Use a writing process to develop and strengthen writing as needed by planning, revising, editing, rewriting, or trying a new approach, addressing what is most significant for a specific purpose and audience. Use guidance and support from peers, adults, and/or digital tools as needed. (Editing for conventions should demonstrate command of Language standards 1-3 up to and including grades 9-10.)",tags:["writing-process"]},{id:"SD-W-9-10-6",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.6",text:"Use technology to produce, revise, edit, and/or publish individual or shared writing products, and interact or collaborate with others, taking advantage of technology's capacity to link to other information and to display information flexibly and dynamically.",tags:["handwriting-keyboarding","digital-media-use"]},{id:"SD-W-9-10-7",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.7",text:"Conduct short as well as more sustained research; narrow or broaden the inquiry when appropriate; demonstrate understanding of the subject under investigation using multiple sources.",tags:["inquiry-process"]},{id:"SD-W-9-10-8",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.8",text:"Gather relevant information from multiple sources. a. Use advanced searches effectively. b. Assess the relevance, accuracy, and credibility of each source. c. Fluently integrate information (e.g. paraphrases, summaries, direct quotations, elaborations, and attributions). d. Avoid plagiarism and follow a standard format for citation.",tags:["inquiry-process","source-evaluation","integrating-sources","citation-format"]},{id:"SD-W-9-10-9",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.9",text:"Draw relevant evidence from literary or informational texts to support analysis, reflection, narrative and creative texts, and research, applying one or more grade 9-10 standards for Reading Literature or Reading Informational Text as needed.",tags:["textual-evidence","lit-evidence-understanding","nonfiction-evidence-understanding"]},{id:"SD-W-9-10-10",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.10",text:"Write routinely over extended time frames (for research, reflection, and revision) and shorter time frames for a range of tasks, purposes, and audiences; independently select writing topics and formats for personal enjoyment, interest, academic tasks, and career readiness: cover letter, resume, letter of application, business letter.",tags:["range-of-writing","independent-reading"]},{id:"SD-SL-9-10-1",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Speaking & Listening",code:"9-10.SL.1",text:"Initiate and participate effectively in a variety of collaborative discussions (one-on-one, in groups, and teacher-led) on grades 9-10 topics, texts, and issues, building on others' ideas and expressing their own clearly and persuasively. a. Come to discussions prepared having read and researched material under study; explicitly draw on that preparation by referring to evidence from texts and other research on the topic or issue to stimulate a thoughtful, well-reasoned exchange of ideas. b. Collaborate with peers to set norms for collegial discussions and decision-making (e.g., informal consensus, taking votes on key issues, and presentation of alternate views), clear goals and deadlines, and individual roles as needed. c. Propel conversations by posing and responding to questions that relate the current discussion to broader themes or larger ideas; actively incorporate others into the discussion; and clarify, verify, or challenge ideas and conclusions. d. Respond thoughtfully to various perspectives, summarize points of agreement and disagreement, and, when warranted, qualify or justify their own views and understanding and make new connections in light of the evidence and reasoning presented.",tags:["collaborative-discussion","speaking-listening"]},{id:"SD-SL-9-10-2",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Speaking & Listening",code:"9-10.SL.2",text:"Evaluate multiple sources of information presented in diverse media or formats (e.g., visually, quantitatively, orally). Evaluate the credibility and accuracy of each source. Integrate multiple sources of information when presenting.",tags:["media-analysis","source-evaluation","integrating-sources"]},{id:"SD-SL-9-10-3",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Speaking & Listening",code:"9-10.SL.3",text:"Evaluate a speaker's point of view, reasoning, intended audience, and use of evidence and rhetoric, identifying any faulty reasoning or exaggerated or distorted evidence.",tags:["evaluating-speakers","rhetorical-analysis"]},{id:"SD-SL-9-10-4",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Speaking & Listening",code:"9-10.SL.4",text:"Present content appropriate to the audience, task, and purpose while respecting intellectual property. a. Demonstrate organization, development, substance, and style. b. Demonstrate effective nonverbal communication (eye contact, facial expressions, gestures, presence, and proximity). c. Demonstrate effective verbal communication (volume, pace, tone, enunciation).",tags:["oral-presentation","speaking-listening"]},{id:"SD-SL-9-10-5",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Speaking & Listening",code:"9-10.SL.5",text:"Integrate digital media and visual displays in presentations to enhance understanding of findings, reasoning, and evidence and to add interest.",tags:["digital-media-use","multimodal-literacies"]},{id:"SD-SL-9-10-6",state:"South Dakota",stateAbbr:"SD",grade:"9-10",gradesCovered:[9,10],strand:"Speaking & Listening",code:"9-10.SL.6",text:"Adapt speech to a variety of contexts, purposes, audiences, and tasks. Use self-reflection and feedback from others. Demonstrate a command of standard English when indicated or appropriate. (See grades 9-10 Language standards 1 and 3 for specific expectations.)",tags:["formal-english","speaking-listening"]},{id:"SD-RL-11-12-1",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.1",text:"Accurately cite strong, relevant, and thorough textual evidence to support analysis of what the text says explicitly and inferentially, including determining where the text is open for interpretation.",tags:["textual-evidence"]},{id:"SD-RL-11-12-2",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.2",text:"Determine two or more themes or central ideas of a text. a. Analyze and evaluate their development over the course of the text, including how they interact and build on one another within a complex account. b. Provide an objective summary of the text to support thematic analysis.",tags:["theme-development"]},{id:"SD-RL-11-12-3",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.3",text:"Analyze the impact of the author's choices regarding how to develop and relate elements of a text (e.g., context, setting, theme, plot events, structure, and character development).",tags:["character-development","lit-text-structure"]},{id:"SD-RL-11-12-4",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.4",text:"Interpret the impact of specific word choices and figurative language on meaning, mood, and tone, including words with multiple meanings (e.g., connotation, jargon, allusions, colloquialisms).",tags:["word-choice-impact","figurative-language","allusion"]},{id:"SD-RL-11-12-5",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.5",text:"Analyze how an author's choices concerning how to structure specific parts of a text (e.g., the choice of where to begin or end a story, the choice to provide a comedic or tragic resolution) contribute to its overall structure and meaning as well as its aesthetic impact.",tags:["lit-text-structure"]},{id:"SD-RL-11-12-6",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.6",text:"Analyze how the author's background, point of view, and/or purpose shapes the content and style from diverse texts. Evaluate the author's choice of what is stated explicitly or implicitly. Reflect on how personal experiences impact interpretations of a text.",tags:["point-of-view","authorial-intent"]},{id:"SD-RL-11-12-7",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.7",text:"Analyze multiple interpretations of a story, drama, or poem in different artistic mediums, evaluating how each version interprets the source text.",tags:["multiple-interpretations","media-comparison"]},{id:"SD-RL-11-12-9",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.9",text:"Analyze a variety of foundational works of American, British or World literature, two or more texts from the same period. Evaluate how an author draws on, alludes to, or transforms source material to provide a deeper and more thorough interpretation of the text.",tags:["seminal-documents","comparing-texts","allusion"]},{id:"SD-RL-11-12-10",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Literature",code:"11-12.RL.10",text:"By the end of the year, independently read and comprehend literary texts representing a variety of genres, cultures, and perspectives that exhibit complexity appropriate for at least grade 11 and 12. a. Demonstrate proficiency in reading and comprehending grade-appropriate texts. b. Self-select texts for personal enjoyment, interest, and academic tasks. c. Read widely to understand multiple perspectives and diverse viewpoints.",tags:["text-complexity","independent-reading","volume-of-reading"]},{id:"SD-RI-11-12-1",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.1",text:"Accurately cite strong, relevant, and thorough textual evidence to support analysis of what the text says explicitly and inferentially, including determining where the text is open for interpretation.",tags:["textual-evidence"]},{id:"SD-RI-11-12-2",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.2",text:"Determine two or more central ideas or claims of a text. a. Analyze and evaluate their development over the course of the text, including how they interact and build on one another within a complex text. b. Provide an objective summary of the text to support analysis.",tags:["central-idea"]},{id:"SD-RI-11-12-3",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.3",text:"Analyze a complex set of ideas or sequence of events and explain how specific individuals, ideas, or events interact and develop over the course of the text.",tags:["analysis-of-ideas"]},{id:"SD-RI-11-12-4",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.4",text:"Interpret figurative, connotative, and technical meanings. Analyze how an author uses and refines key term(s) as they shape meaning or tone.",tags:["figurative-language","word-choice-impact","word-nuance"]},{id:"SD-RI-11-12-5",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.5",text:"Analyze and evaluate the effectiveness of text structure in an exposition or argument, including whether the structure makes points clear, convincing, and engaging.",tags:["nonfiction-text-structure","rhetorical-analysis"]},{id:"SD-RI-11-12-6",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.6",text:"Determine an author's point of view or purpose in a text in which the rhetoric is particularly effective, analyzing how style and content contribute to its overall rhetorical effectiveness. Evaluate a text for bias, misinformation, propaganda, counter arguments, and/or fallacies.",tags:["point-of-view","rhetorical-analysis","argument-evaluation"]},{id:"SD-RI-11-12-7",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.7",text:"Integrate and evaluate multiple sources of information presented in different media or formats (e.g., visually, verbally, quantitatively) in order to address a question or solve a problem.",tags:["integrating-sources","media-comparison"]},{id:"SD-RI-11-12-8",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.8",text:"Delineate and evaluate the reasoning in seminal U.S. and British/global texts, including the validity, relevancy, and sufficiency of founding principles, legal reasoning, and arguments.",tags:["argument-evaluation","seminal-documents","public-advocacy"]},{id:"SD-RI-11-12-9",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.9",text:"Analyze foundational U.S. and British/global documents of historical and literary significance. Evaluate the approaches of two or more authors for their central ideas, purposes, and rhetorical features.",tags:["seminal-documents","comparing-texts","rhetorical-analysis"]},{id:"SD-RI-11-12-10",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Reading Informational Text",code:"11-12.RI.10",text:"By the end of the year, independently read and comprehend literary nonfiction and informational texts representing a variety of genres, cultures, and perspectives that exhibit complexity appropriate for at least grade 11 and 12. a. Demonstrate proficiency in reading and comprehending grade-appropriate texts. b. Self-select texts for personal enjoyment, interest, and academic tasks. c. Read widely to understand diverse perspectives and viewpoints.",tags:["text-complexity","independent-reading","volume-of-reading"]},{id:"SD-L-11-12-1",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"11-12.L.1",text:"Demonstrate command of standard English grammar and usage when writing or speaking. Consult references as needed. a. Apply the understanding that usage is a matter of convention, can change over time and within different contexts, and is sometimes contested. b. Resolve issues of complex or contested grammar and usage. c. Understand the purpose or value of nonstandard English grammar and usage (e.g., artistic or stylistic choices, dialects, colloquialisms).",tags:["usage-conventions","formal-english"]},{id:"SD-L-11-12-2",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"11-12.L.2",text:"Demonstrate command of standard English mechanics and conventions. Consult references as needed. a. Apply the understanding that mechanics are a matter of convention, can change over time and within different contexts, and are sometimes contested. b. Resolve issues of complex or contested mechanics and conventions. c. Understand the purpose or value of nonstandard English mechanics and conventions (e.g., artistic or stylistic choices in capitalization, punctuation, and spelling).",tags:["usage-conventions","punctuation","spelling"]},{id:"SD-L-11-12-3",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"11-12.L.3",text:"Apply knowledge of language to understand how language functions in different contexts, to make effective choices for meaning or style, and to comprehend more fully when reading or listening. Vary syntax for effect, consulting references for guidance as needed; apply an understanding of syntax to the study of complex texts when reading.",tags:["sentence-structure","formal-english"]},{id:"SD-L-11-12-4",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"11-12.L.4",text:"Determine or clarify the meaning of unknown and multiple-meaning words and phrases based on grades 11-12 reading and content, choosing flexibly from a range of strategies. a. Use context (e.g., the overall meaning of a sentence, paragraph, or text; a word's position or function in a sentence) to determine the meaning of a word or phrase. b. Analyze morphology to explore different meanings or parts of speech (e.g., conceive, conception, conceivable). c. Consult general and specialized reference materials to find the pronunciation of a word, explore its meaning, its part of speech, its etymology, or its standard usage.",tags:["context-clues","word-patterns","reference-materials"]},{id:"SD-L-11-12-5",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"11-12.L.5",text:"Demonstrate understanding of semantics. a. Analyze figurative language in context and its role in the text. b. Analyze word relationships (morphology, etymology, linguistics) and their role in creating nuanced meaning. c. Analyze connotative meanings of words with similar denotations.",tags:["figurative-language","word-patterns","word-nuance"]},{id:"SD-L-11-12-6",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Language",code:"11-12.L.6",text:"Acquire and accurately use general academic and domain-specific words and phrases sufficient for reading, writing, speaking, and listening at the college and career readiness level. a. Demonstrate independence in gathering a broad, deep, and precise vocabulary. b. Understand the importance of vocabulary knowledge in comprehension or expression.",tags:["academic-vocabulary"]},{id:"SD-W-11-12-1",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.1",text:"Write arguments to support claims in an analysis of substantive topics or texts, using valid reasoning and relevant and sufficient evidence. a. Introduce precise, knowledgeable claim(s), establish the significance of the claim(s), distinguish the claim(s) from alternate or opposing claims, and create an organization that logically sequences claim(s), counterclaims, reasons, and evidence. b. Develop claim(s) and counterclaims fairly and thoroughly, supplying the most relevant evidence for each while pointing out the strengths and limitations of both in a manner that anticipates the audience's knowledge level, concerns, values, and possible biases. c. Use appropriate and varied transitions and syntax to fluently link the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, between reasons and evidence, and between claim(s) and counterclaims. d. Establish and maintain a formal style and clear, engaging voice while attending to the norms and conventions of the discipline in which they are writing. e. Craft an effective conclusion.",tags:["argument-writing","writing-organization","formal-english"]},{id:"SD-W-11-12-2",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.2",text:"Write informative/explanatory texts to examine and convey complex ideas, concepts, and information clearly and accurately through the effective selection, organization, and analysis of content. a. Introduce a topic; organize complex ideas, concepts, and information to create a unified whole; include formatting (e.g., headings), graphics (e.g., figures, tables), and multimedia when useful to aid comprehension. b. Elaborate on the topic thoroughly by selecting the most relevant facts, extended definitions, concrete details, quotations, or other information and examples appropriate to the audience's knowledge of the topic. c. Use appropriate and varied syntax to fluently link the major sections of the text, create cohesion, and clarify the relationships among complex ideas and concepts. d. Use precise language, domain-specific vocabulary, and techniques such as metaphor, simile, and analogy to manage the complexity of the topic. e. Establish a clear, engaging voice. f. Craft an effective conclusion.",tags:["informational-writing","writing-organization","precise-language"]},{id:"SD-W-11-12-3",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.3",text:"Write narratives or other creative texts (e.g., poetry, digital composition, graphic stories, memoirs) to develop real or imagined experiences or events using effective technique and established voice, well-chosen details, and well-structured event sequences. a. Engage and orient the reader by setting out a problem, situation, or observation and its significance, establishing one or multiple point(s) of view, and introducing a narrator and/or characters; create an intentional progression of experiences or events. b. Use a variety of literary or narrative techniques or poetic devices. c. Use a variety of techniques to sequence events to create a coherent whole and build toward a particular tone and outcome. d. Use strong, effective word choice and figurative language. e. Establish a clear, engaging voice. f. Craft an effective conclusion, when appropriate to the genre.",tags:["narrative-writing","writing-organization"]},{id:"SD-W-11-12-4",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.4",text:"Produce clear and coherent writing in which the development, organization, style, voice, and tone are appropriate to task, purpose, and audience. (Grade band specific expectations for writing types are defined in standards 1-3 above.)",tags:["range-of-writing","writing-organization"]},{id:"SD-W-11-12-5",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.5",text:"Use a writing process to develop and strengthen writing as needed by planning, revising, editing, rewriting, or trying a new approach, focusing on addressing what is most significant for a specific purpose and audience. Use feedback from peers, adults, and/or digital tools, as appropriate. (Editing for conventions should demonstrate command of Language standards 1-3 up to and including grades 11-12.)",tags:["writing-process"]},{id:"SD-W-11-12-6",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.6",text:"Use technology to produce and publish writing and to interact and collaborate with others.",tags:["handwriting-keyboarding","digital-media-use"]},{id:"SD-W-11-12-7",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.7",text:"Conduct short as well as more sustained, focused research. Use appropriate methodology to demonstrate a thorough understanding of the subject under investigation.",tags:["inquiry-process"]},{id:"SD-W-11-12-8",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.8",text:"Gather relevant information from multiple credible sources. a. Use advanced searches effectively. b. Assess the strengths and limitations of each source (e.g., relevance, accuracy, and credibility) in terms of the task, purpose, and audience. c. Fluently integrate information (e.g., paraphrases, summaries, direct quotations, elaborations, and attributions). d. Avoid plagiarism and overreliance on one source. Follow a standard format for citation.",tags:["inquiry-process","source-evaluation","integrating-sources","citation-format"]},{id:"SD-W-11-12-9",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.9",text:"Draw relevant evidence from literary or informational texts to support analysis, reflection, narrative and creative texts, and research, applying one or more grade 11-12 standards for Reading Literature or Reading Informational Text as needed.",tags:["textual-evidence","lit-evidence-understanding","nonfiction-evidence-understanding"]},{id:"SD-W-11-12-10",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.10",text:"Write routinely over extended time frames (for research, reflection, and revision) and shorter time frames (a single sitting or a day or two) for a range of tasks, purposes, and audiences; independently select writing topics and formats for personal enjoyment, interest, and academic tasks.",tags:["range-of-writing","independent-reading"]},{id:"SD-SL-11-12-1",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Speaking & Listening",code:"11-12.SL.1",text:"Initiate and participate effectively in a range of collaborative discussions (one-on-one, in groups, and teacher-led) on grades 11-12 topics, texts, and issues, building on others' ideas and expressing their own clearly and persuasively. a. Come to discussions prepared, having read and researched material under study; explicitly draw on that preparation by referring to evidence from texts and other research on the topic or issue to stimulate a thoughtful, well-reasoned exchange of ideas. b. Collaborate with peers to promote civil, democratic discussions and decision-making, set clear goals and deadlines, and establish individual roles as needed. c. Propel conversations by posing and responding to questions that probe reasoning and evidence; ensure a hearing for a full range of positions on a topic or issue; clarify, verify, or challenge ideas and conclusions; and promote divergent and creative perspectives. d. Respond thoughtfully to diverse perspectives; synthesize comments, claims, and evidence made on all sides of an issue; resolve contradictions when possible; and determine what additional information or research is required to deepen the investigation or complete the task.",tags:["collaborative-discussion","speaking-listening"]},{id:"SD-SL-11-12-2",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Speaking & Listening",code:"11-12.SL.2",text:"Integrate multiple sources of information when presenting. Evaluate information presented in diverse media or formats (e.g., visually, quantitatively, orally) in order to make informed decisions and solve problems, evaluating the credibility and accuracy of each source and noting any discrepancies among the data.",tags:["integrating-sources","media-analysis","source-evaluation"]},{id:"SD-SL-11-12-3",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Speaking & Listening",code:"11-12.SL.3",text:"Evaluate a speaker's point of view, reasoning, intended audience, and use of evidence and rhetoric, assessing the stance, premises, links among ideas, word choice, points of emphasis, and tone used.",tags:["evaluating-speakers","rhetorical-analysis"]},{id:"SD-SL-11-12-4",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Speaking & Listening",code:"11-12.SL.4",text:"Present content appropriate to the audience, task, and purpose while respecting intellectual property. a. Demonstrate organization, development, substance, and style. b. Demonstrate effective nonverbal communication (eye contact, facial expressions, gestures, presence, and proximity). c. Demonstrate effective verbal communication (volume, pace, tone, enunciation).",tags:["oral-presentation","speaking-listening"]},{id:"SD-SL-11-12-5",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Speaking & Listening",code:"11-12.SL.5",text:"Make strategic use of digital media and visual displays in presentations to enhance understanding of findings, reasoning, and evidence and to add interest.",tags:["digital-media-use","multimodal-literacies"]},{id:"SD-SL-11-12-6",state:"South Dakota",stateAbbr:"SD",grade:"11-12",gradesCovered:[11,12],strand:"Speaking & Listening",code:"11-12.SL.6",text:"Adapt speech and communication to a variety of contexts, audiences, tasks. Use self-reflection and feedback from others. Demonstrate a command of standard English conventions when indicated or appropriate. (See grades 11-12 Language standards 1 and 3 for specific expectations.)",tags:["formal-english","speaking-listening"]},{id:"IN-RC-9-10-1",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.1",text:"Analyze what a text says both explicitly and implicitly (e.g., inferences and interpretations) by citing strong and thorough textual evidence.",tags:["textual-evidence"],essential:!0},{id:"IN-RC-9-10-2",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.2",text:"Analyze in detail the development of two or more themes over the course of a work of literature, including how they emerge and are specific and refined by specific details.",tags:["theme-development"],essential:!0},{id:"IN-RC-9-10-3",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.3",text:"Analyze and evaluate how an author's choices concerning how to structure a work of literature, order events within it (e.g., parallel episodes), and manipulate time (e.g., pacing, flashbacks) contribute to the overall meaning and effect of a work.",tags:["lit-text-structure"],essential:!1},{id:"IN-RC-9-10-4",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.4",text:"Analyze in detail the development of two or more central ideas over the course of a text, including how they build on one another to provide a complex analysis.",tags:["central-idea"],essential:!1},{id:"IN-RC-9-10-5",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.5",text:"Analyze a series of ideas or events, including the order in which the points are made and developed, and the connections that are drawn between them.",tags:["analysis-of-ideas"],essential:!1},{id:"IN-RC-9-10-6",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.6",text:"Determine an author's perspective or purpose in a text, and analyze how an author uses rhetoric to advance that perspective or purpose.",tags:["point-of-view","rhetorical-analysis"],essential:!1},{id:"IN-RC-9-10-7",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.7",text:"Delineate and evaluate the argument and specific claims in a text, assessing whether the reasoning is valid and the evidence is relevant and sufficient; identify false statements and fallacious reasoning.",tags:["argument-evaluation"],essential:!1},{id:"IN-RC-9-10-8",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.8",text:"Analyze U.S. and world documents of historical and literary significance, including how they address related themes and concepts.",tags:["seminal-documents","comparing-texts"],essential:!1},{id:"IN-RC-9-10-9",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.9",text:"Use context to determine or clarify the meaning of words and phrases.",tags:["context-clues"],essential:!1},{id:"IN-RC-9-10-10",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.10",text:"Analyze nuances in the meaning of words with similar denotations.",tags:["word-nuance"],essential:!1},{id:"IN-RC-9-10-11",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.11",text:"Identify and correctly use patterns of word changes that indicate different meanings or parts of speech (e.g., analyze, analysis, analytical; advocate, advocacy).",tags:["word-patterns"],essential:!1},{id:"IN-RC-9-10-12",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.12",text:"Analyze the meaning of words and phrases as they are used in works of literature, including figurative, connotative, and denotative meanings; analyze the impact of specific word choices on meaning and tone, including words with multiple meanings.",tags:["figurative-language","word-choice-impact"],essential:!0},{id:"IN-RC-9-10-13",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Reading Comprehension",code:"9-10.RC.13",text:"Determine the meaning of words and phrases as they are used in a nonfiction text, including figurative, connotative, denotative, and technical meanings; evaluate the effectiveness of specific word choices on meaning and tone in multiple and varied contexts.",tags:["figurative-language","word-choice-impact"],essential:!1},{id:"IN-W-9-10-1",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.1",text:"Write arguments in a variety of forms that: a. Introduce claim(s), distinguish the claim(s) from alternate or opposing claims, and create an organization that establishes clear relationships among claim(s), counterclaims, reasons, and evidence. b. Use rhetorical strategies to enhance the effectiveness of the claim. c. Develop claim(s) and counterclaims fairly, supplying evidence for each while pointing out the strengths and limitations of both in a manner that anticipates the audience's knowledge level and concerns. d. Use effective transitions to link the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, between reasons and evidence, and between claim(s) and counterclaims. e. Establish and maintain a consistent style and tone appropriate for the purpose and audience. f. Provide a concluding statement or section that follows from and supports the argument presented.",tags:["argument-writing","writing-organization","formal-english"],essential:!0},{id:"IN-W-9-10-2",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.2",text:"Write informative compositions on a variety of topics that: a. Introduce a topic and organize complex ideas, concepts, and information to make important connections and distinctions. b. Develop the topic utilizing credible sources with relevant, and sufficient facts, extended definitions, concrete details, quotations, or other information and examples appropriate to the audience's knowledge of the topic. c. Use appropriate transitions to link the major sections of the text, create cohesion, and clarify the relationships among complex ideas and concepts. d. Choose language and content-specific vocabulary that express ideas precisely and concisely to manage the complexity of the topic, recognizing and eliminating wordiness and redundancy. e. Establish and maintain a style appropriate for the purpose and audience. f. Provide a concluding statement or section that follows and supports the information or explanation presented (e.g., articulating implications or the significance of the topic).",tags:["informational-writing","writing-organization","precise-language","formal-english"],essential:!0},{id:"IN-W-9-10-3",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.3",text:"Write narrative compositions in a variety of forms that: a. Engage and orient the reader by setting out a problem, situation, or observation, establishing one or multiple point(s) of view, and introducing a narrator and/or characters. b. Create a smooth progression of experiences or events. c. Use narrative techniques, such as dialogue, pacing, description, reflection, and multiple plotlines to develop experiences, events, and/or characters. d. Use a variety of techniques to sequence events so that they build on one another to create a coherent whole. e. Use precise words and phrases, telling details, and sensory language to convey a vivid picture of the experiences, events, setting, and/or characters. f. Provide an ending that follows and reflects on what is experienced, observed, or resolved over the course of the narrative.",tags:["narrative-writing","writing-organization"],essential:!0},{id:"IN-W-9-10-4",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.4",text:"Apply the writing process to all formal writing including but not limited to argumentative, informative, and narrative. a. Plan and develop, draft, and revise writing using appropriate reference materials. Rewrite, try a new approach, focusing on addressing what is most significant for a specific purpose and audience, and edit to produce and strengthen writing that is clear and coherent. b. Use technology to generate, produce, publish, and update individual or shared writing products, taking advantage of technology's capacity to link to other information and to display information flexibly and dynamically (e.g., use of publishing programs, integration of multimedia). c. Utilize a standard style guide framework for in-text documentation, formatting, and works cited in order to properly credit sources in all writing types, utilizing multiple sources when appropriate.",tags:["writing-process","handwriting-keyboarding","digital-media-use","citation-format","style-manual"],essential:!1},{id:"IN-W-9-10-5",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.5",text:"Conduct more sustained research assignments and tasks to build knowledge about the research process and the topic under study. a. Formulate an inquiry question and refine and narrow the focus as research evolves. b. Gather relevant information from multiple authoritative sources, using advanced searches effectively, and annotate sources. c. Assess the usefulness of each source in answering the research question. d. Synthesize and integrate information into the text selectively to maintain the flow of ideas. e. Avoid plagiarism and over reliance on any one source and follow a standard format (e.g., MLA, APA) for citation. f. Present information, choosing from a variety of formats.",tags:["inquiry-process","source-evaluation","integrating-sources","citation-format"],essential:!0},{id:"IN-W-9-10-6",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.6",text:"Demonstrate command of English grammar and usage, focusing on: a. Verbs - Forming and using verbs in the indicative, imperative, interrogative, conditional and subjunctive moods. b. Usage - Identifying and using parallelism in all writing to present items in a series and items juxtaposed for emphasis.",tags:["voice-and-mood","sentence-structure","usage-conventions"],essential:!0},{id:"IN-W-9-10-7",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Writing",code:"9-10.W.7",text:"Demonstrate command of the conventions of standard English capitalization, punctuation, and spelling focusing on: a. Punctuation - Using a semicolon and a conjunctive adverb to link two or more closely related independent clauses.",tags:["punctuation","spelling","usage-conventions"],essential:!0},{id:"IN-CC-9-10-1",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.1",text:"Initiate and participate effectively in a range of collaborative discussions on grade-appropriate topics, texts, and issues, building on others' ideas and expressing personal ideas clearly and persuasively.",tags:["collaborative-discussion","speaking-listening"],essential:!0},{id:"IN-CC-9-10-2",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.2",text:"Examine, analyze, and reflect on ideas under discussion by providing textual evidence to support or refute those ideas.",tags:["collaborative-discussion","textual-evidence"],essential:!0},{id:"IN-CC-9-10-3",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.3",text:"Expand conversations by posing and responding to questions that relate the current discussion to broader themes or larger ideas; actively incorporate others into the discussion; and clarify, verify, or challenge ideas and conclusions.",tags:["collaborative-discussion","speaking-listening"],essential:!1},{id:"IN-CC-9-10-4",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.4",text:"Respond thoughtfully to multiple perspectives, summarize points of agreement and disagreement, and, when warranted, qualify or justify personal views and understanding and make new connections in reference to the evidence and reasoning presented.",tags:["collaborative-discussion","speaking-listening"],essential:!1},{id:"IN-CC-9-10-5",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.5",text:"Analyze multiple sources of information presented in diverse media and formats while evaluating the credibility and accuracy of each source.",tags:["media-analysis","source-evaluation","integrating-sources"],essential:!1},{id:"IN-CC-9-10-6",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.6",text:"Evaluate a speaker's perspective, reasoning, and use of evidence and rhetoric, identifying any fallacious reasoning or distorted evidence.",tags:["evaluating-speakers","rhetorical-analysis"],essential:!1},{id:"IN-CC-9-10-7",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.7",text:"Present information, findings, and supporting evidence logically so that listeners can follow the line of reasoning, ensuring organization and development are appropriate to purpose, audience, and task.",tags:["oral-presentation","speaking-listening"],essential:!1},{id:"IN-CC-9-10-8",state:"Indiana",stateAbbr:"IN",grade:"9-10",gradesCovered:[9,10],strand:"Communication and Collaboration",code:"9-10.CC.8",text:"Analyze bias in media through the inclusion or exclusion of information and reliability of the source from visual and verbal messages to achieve a desired result.",tags:["media-analysis","source-evaluation"],essential:!0},{id:"IN-RC-11-12-1",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.1",text:"Analyze what a text says explicitly and implicitly (e.g., inferences and interpretations) by citing strong and thorough textual evidence to support and explain how the evidence develops the analysis, including where the text leaves matters uncertain.",tags:["textual-evidence"],essential:!0},{id:"IN-RC-11-12-2",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.2",text:"Compare and contrast the development of similar themes across two or more works of literature, and analyze how they emerge and are shaped and refined by specific details.",tags:["theme-development","comparing-texts"],essential:!1},{id:"IN-RC-11-12-3",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.3",text:"Analyze and evaluate how an author's choices concerning how to structure specific parts of a work of literature (e.g., the choice of where to begin or end a story, the choice to provide a comedic or tragic resolution) contribute to its overall meaning and effect of a work.",tags:["lit-text-structure"],essential:!0},{id:"IN-RC-11-12-4",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.4",text:"Analyze and evaluate works of literary or cultural significance in history for the way in which these works have used archetypes drawn from myths, traditional stories, or religious works, as well as how two or more of the works treat similar themes, conflicts, issues, or topics, and maintain relevance for current audiences.",tags:["seminal-documents","comparing-texts","allusion"],essential:!1},{id:"IN-RC-11-12-5",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.5",text:"Analyze the development of similar central ideas across two or more texts and determine how specific details shape and refine the central idea.",tags:["central-idea","comparing-texts"],essential:!0},{id:"IN-RC-11-12-6",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.6",text:"Analyze a complex set of ideas or sequence of events and explain how specific ideas, events, and individuals develop throughout the text.",tags:["analysis-of-ideas"],essential:!1},{id:"IN-RC-11-12-7",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.7",text:"Determine an author's perspective or purpose in a text in which the rhetoric is particularly effective (e.g., appeals to both friendly and hostile audiences, anticipates and addresses reader concerns and counterclaims), and analyze how style and content contribute to the power and persuasiveness of the text.",tags:["point-of-view","rhetorical-analysis"],essential:!0},{id:"IN-RC-11-12-8",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.8",text:"Delineate and evaluate the arguments and specific claims in U.S. and world texts, assessing whether the reasoning is valid and the evidence is relevant and sufficient; analyze the impact of false statements and fallacious reasoning.",tags:["argument-evaluation","seminal-documents"],essential:!1},{id:"IN-RC-11-12-9",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.9",text:"Synthesize and evaluate multiple sources of information presented in different mediums in order to address a question or solve a problem.",tags:["integrating-sources","media-comparison"],essential:!1},{id:"IN-RC-11-12-10",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.10",text:"Analyze and synthesize foundational U.S. and world documents of historical and literary significance for their themes, purposes, and rhetorical features.",tags:["seminal-documents","rhetorical-analysis"],essential:!1},{id:"IN-RC-11-12-11",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.11",text:"Use context to determine or clarify the meaning of words and phrases.",tags:["context-clues"],essential:!1},{id:"IN-RC-11-12-12",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.12",text:"Analyze nuances in the meaning of words with similar denotations.",tags:["word-nuance"],essential:!1},{id:"IN-RC-11-12-13",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.13",text:"Analyze the meaning of words and phrases as they are used in works of literature, including figurative, connotative, and denotative meanings; analyze the cumulative impact of specific word choices (e.g., imagery, allegory, and symbolism) on meaning and tone (e.g., how the language evokes a sense of time and place; how it sets a formal or informal tone).",tags:["figurative-language","word-choice-impact"],essential:!1},{id:"IN-RC-11-12-14",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Reading Comprehension",code:"11-12.RC.14",text:"Determine the meaning of words and phrases as they are used in a nonfiction text, including figurative, connotative, denotative, and technical meanings; evaluate the cumulative impact of how an author uses and refines the meaning of a key term or terms over the course of a text.",tags:["figurative-language","word-choice-impact"],essential:!0},{id:"IN-W-11-12-1",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.1",text:"Write arguments in a variety of forms that: a. Introduce precise claim(s), establish the significance of the claim(s), distinguish the claim(s) from alternate or opposing claims, and create an organization that logically sequences claim(s), counterclaims, reasons, and evidence. b. Use rhetorical strategies to enhance the effectiveness of the claim. c. Develop claim(s) and counterclaims fairly and thoroughly, supplying the most relevant evidence for each while pointing out the strengths and limitations of both in a manner that anticipates the audience's knowledge level, concerns, values, and possible biases. d. Use effective and varied transitions as well as varied syntax to link the major sections of the text, create cohesion, and clarify the relationships between claim(s) and reasons, between reasons and evidence, and between claim(s) and counterclaims. e. Establish and maintain a consistent style and tone appropriate for the purpose and audience. f. Provide a concluding statement or section that follows and supports the argument presented.",tags:["argument-writing","writing-organization","formal-english"],essential:!0},{id:"IN-W-11-12-2",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.2",text:"Write informative compositions on a variety of topics that: a. Introduce a topic and organize complex ideas, concepts, and information so that each new element builds on that which precedes it to create a unified whole; include formatting (e.g., headings), graphics (e.g., figures, tables), and multimedia when useful to aid comprehension. b. Utilizing credible sources, develop the topic thoroughly by selecting the most significant and relevant facts, extended definitions, concrete details, quotations, or other information and examples appropriate to the audience's knowledge of the topic. c. Use appropriate and varied transitions and syntax to link the major sections of the text, create cohesion, and clarify the relationships among complex ideas and concepts. d. Choose language, content-specific vocabulary, and techniques to manage the complexity of the topic, recognizing and eliminating wordiness and redundancy. e. Establish and maintain a style appropriate for the purpose and audience. f. Provide a concluding statement or section that follows and supports the information or explanation presented (e.g., articulating implications or the significance of the topic).",tags:["informational-writing","writing-organization","precise-language","formal-english"],essential:!0},{id:"IN-W-11-12-3",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.3",text:"Write narrative compositions in a variety of forms that: a. Engage and orient the reader by setting out a problem, situation, or observation and its significance, establishing one or multiple point(s) of view, and introducing a narrator and/or characters. b. Create a smooth progression of experiences or events. c. Use narrative techniques, such as dialogue, pacing, description, reflection, and multiple plotlines to develop experiences, events, and/or characters. d. Use a variety of techniques to sequence events so that they build on one another to create a coherent whole and build toward a particular tone and outcome (e.g., a sense of mystery, suspense, growth, or resolution). e. Use precise words and phrases, telling details, and sensory language to convey a vivid picture of the experiences, events, setting, and/or characters. f. Provide an ending that follows and reflects on what is experienced, observed, or resolved over the course of the narrative.",tags:["narrative-writing","writing-organization"],essential:!0},{id:"IN-W-11-12-4",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.4",text:"Apply the writing process to all formal writing including but not limited to argumentative, informative, and narrative: a. Plan and develop, draft, and revise writing using appropriate reference materials. Rewrite, try a new approach, focusing on addressing what is most significant for a specific purpose and audience, and edit to produce and strengthen writing that is clear and coherent. b. Use technology to generate, produce, publish, and update individual or shared writing products in response to ongoing feedback, including new arguments or information. c. Utilize a standard style guide framework for in-text documentation, formatting, and works cited in order to properly credit sources in all writing types, utilizing multiple sources when appropriate.",tags:["writing-process","handwriting-keyboarding","digital-media-use","citation-format","style-manual"],essential:!1},{id:"IN-W-11-12-5",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Writing",code:"11-12.W.5",text:"Conduct more sustained research assignments and tasks to build knowledge about the research process and the topic understudy. a. Formulate an inquiry question and refine and narrow the focus as research evolves. b. Gather relevant information from multiple types of authoritative sources, using advanced searches effectively, and annotate sources. c. Assess the strengths and limitations of each source in terms of the task, purpose, and audience. d. Synthesize and integrate information into the text selectively to maintain the flow of ideas. e. Avoid plagiarism and over reliance on any one source and follow a standard format (e.g., MLA, APA) for citation. f. Present information, choosing from a variety of formats.",tags:["inquiry-process","source-evaluation","integrating-sources","citation-format"],essential:!0},{id:"IN-CC-11-12-1",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.1",text:"Initiate and engage in a range of collaborative discussions on grade-appropriate topics, texts, and issues, building on others' ideas and expressing personal ideas clearly and persuasively.",tags:["collaborative-discussion","speaking-listening"],essential:!1},{id:"IN-CC-11-12-2",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.2",text:"Engage in a thoughtful, well-reasoned exchange of ideas by referring to specific evidence.",tags:["collaborative-discussion","textual-evidence"],essential:!0},{id:"IN-CC-11-12-3",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.3",text:"Expand conversations by posing and responding to questions that probe reasoning and evidence; ensure a hearing for a full range of positions on a topic or issue; clarify, verify, or challenge ideas and conclusions; and promote divergent and creative perspectives.",tags:["collaborative-discussion","speaking-listening"],essential:!1},{id:"IN-CC-11-12-4",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.4",text:"Conduct, debate, and discuss to allow all views to be presented; allow for a dissenting view, in addition to group compromise; and determine what additional information or research is required to deepen the investigation or complete the task.",tags:["collaborative-discussion","speaking-listening"],essential:!0},{id:"IN-CC-11-12-5",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.5",text:"Evaluate a speaker's perspective, reasoning, and use of evidence and rhetoric, as well as assessing stylistic choices such as word choice, points of emphasis, and tone.",tags:["evaluating-speakers","rhetorical-analysis"],essential:!0},{id:"IN-CC-11-12-6",state:"Indiana",stateAbbr:"IN",grade:"11-12",gradesCovered:[11,12],strand:"Communication and Collaboration",code:"11-12.CC.6",text:"Using a range of informal and formal tasks, present information, findings, and supporting evidence, conveying a clear and distinct perspective, such that listeners can follow the line of reasoning. Address opposing perspectives, ensuring the organization, development, substance, and style are appropriate to purpose and audience.",tags:["oral-presentation","speaking-listening"],essential:!1},{id:"IN-CC-11-12-7",state:"Indiana",stateAbbr:"IN",gr
